<title>Kon Pop Grant Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a working desk. Left rail lists the grants (by deadline) with progress; the main column is one grant's form, question by question. Rail becomes a dropdown on phones. */
:root{
  --bg:#F6F4F8; --surface:#FFFFFF; --sunk:#EFEBF4; --ink:#241C2C; --ink-2:#5D5369; --ink-3:#8B8297; --rule:#DED7E7;
  --brand:#B42A3C; --brand-soft:#F8E3E6; --lav:#C6BEDA; --lav-soft:#ECE8F4;
  --good:#2C7A4E; --good-soft:#E1F1E7; --warn:#9E5B00; --warn-soft:#FBEFD8;
  --f-display:"Archivo","Arial Narrow","Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Thai","Segoe UI","Leelawadee UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17131C; --surface:#201A27; --sunk:#2A2333; --ink:#EFEAF4; --ink-2:#B9AFC6; --ink-3:#877D95; --rule:#372E42;
    --brand:#F07A88; --brand-soft:#3D1E25; --lav:#8E84A8; --lav-soft:#2C2639;
    --good:#6CC892; --good-soft:#173023; --warn:#E9AF55; --warn-soft:#33281A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17131C; --surface:#201A27; --sunk:#2A2333; --ink:#EFEAF4; --ink-2:#B9AFC6; --ink-3:#877D95; --rule:#372E42;
  --brand:#F07A88; --brand-soft:#3D1E25; --lav:#8E84A8; --lav-soft:#2C2639;
  --good:#6CC892; --good-soft:#173023; --warn:#E9AF55; --warn-soft:#33281A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0; padding-inline:16px; padding-block:0 64px; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55}
h1,h2,h3{margin:0; text-wrap:balance; line-height:1.2}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--brand); outline-offset:2px}
.wrap{max-width:1240px; margin-inline:auto}
.caps{font-family:var(--f-display); font-stretch:72%; text-transform:uppercase; letter-spacing:.04em; font-weight:700}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* top */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); border-bottom:1px solid var(--rule); margin-inline:-16px; padding-inline:16px}
.top-in{display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; padding-block:12px}
.mark{display:flex; align-items:baseline; gap:10px; margin-right:auto}
.mark b{font-family:var(--f-display); font-stretch:68%; font-weight:800; font-size:24px; letter-spacing:.02em; text-transform:uppercase}
.mark b i{font-style:normal; color:var(--brand)}
.mark span{color:var(--ink-2); font-size:13px}
.status{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2)}
.status i{width:8px; height:8px; border-radius:50%; background:var(--ink-3)}
.status[data-s="db"] i{background:var(--good)}
.status[data-s="warn"] i{background:var(--warn)}

/* layout */
.layout{display:grid; grid-template-columns:270px minmax(0,1fr); gap:28px; padding-block:24px}
.rail{position:sticky; top:calc(env(safe-area-inset-top,0px) + 72px); align-self:start; max-height:calc(100vh - 96px); overflow-y:auto; display:grid; gap:6px; padding-bottom:12px}
.rail-head{font-size:11px; color:var(--ink-3); padding:10px 10px 4px}
.ri{display:grid; gap:6px; text-align:left; width:100%; background:none; border:1px solid transparent; border-radius:8px; padding:9px 10px; cursor:pointer}
.ri:hover{background:var(--surface); border-color:var(--rule)}
.ri[aria-current="true"]{background:var(--surface); border-color:var(--lav); box-shadow:inset 3px 0 0 var(--brand)}
.ri-top{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
.ri-name{font-weight:600; font-size:14px}
.meter{height:5px; border-radius:3px; background:var(--sunk); overflow:hidden}
.meter i{display:block; height:100%; background:var(--good)}
.pick{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr); gap:16px; padding-block:16px}
  .rail{display:none}
  .pick{display:grid; gap:4px}
  .pick select{width:100%; padding:10px; border:1px solid var(--rule); border-radius:8px; background:var(--surface); font-weight:600}
}

/* chips */
.chip{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; background:var(--sunk); color:var(--ink-2); white-space:nowrap}
.chip.hot{background:var(--brand-soft); color:var(--brand)}
.chip.good{background:var(--good-soft); color:var(--good)}
.chip.warn{background:var(--warn-soft); color:var(--warn)}
.chip.lav{background:var(--lav-soft); color:var(--ink)}

/* grant header */
.ghead{display:grid; gap:14px; padding-bottom:20px; border-bottom:1px solid var(--rule); margin-bottom:20px}
.eyebrow{font-size:12px; color:var(--ink-2)}
.ghead h1{font-family:var(--f-display); font-stretch:75%; font-weight:800; font-size:clamp(30px,4.6vw,46px); text-transform:uppercase; letter-spacing:.01em; line-height:1}
.ghead .full{color:var(--ink-2); max-width:70ch}
.due{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:baseline}
.due .when{font-weight:600}
.due .tz{font-size:13px; color:var(--ink-2)}
.facts-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 20px; font-size:13px}
.facts-row div{display:grid; gap:1px}
.facts-row span:first-child{font-size:11px; color:var(--ink-3)}
.prog{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center}
.prog .big{font-family:var(--f-display); font-stretch:75%; font-weight:800; font-size:28px; line-height:1}
.prog .meter{flex:1 1 200px; height:8px}
.actions{display:flex; flex-wrap:wrap; gap:8px}
.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--rule); background:var(--surface); border-radius:8px; padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:var(--surface)}
.btn.quiet{background:none; border-color:transparent; color:var(--ink-2)}
.dl{display:none !important}
.can-dl .dl{display:inline-flex !important}
details.read{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r); padding:12px 16px}
details.read summary{cursor:pointer; font-weight:600}
.notes{display:grid; gap:8px; margin-top:10px; font-size:14px; max-width:78ch}
.notes ul{margin:0; padding-left:20px; display:grid; gap:4px}
mark.fill{background:var(--brand-soft); color:var(--brand); border-radius:3px; padding:0 2px}
mark.confirm{background:var(--warn-soft); color:var(--warn); border-radius:3px; padding:0 2px}

/* groups + fields */
.group{display:grid; gap:14px; margin-top:26px}
.group > h2{font-family:var(--f-display); font-stretch:75%; text-transform:uppercase; letter-spacing:.03em; font-size:18px; color:var(--ink-2); font-weight:700}
.field{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r); padding:18px; display:grid; gap:12px}
.field.is-ready{border-color:color-mix(in srgb,var(--good) 45%,var(--rule))}
.fhead{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:flex-start; justify-content:space-between}
.fhead h3{font-size:16px; font-weight:600; max-width:60ch}
.fmeta{display:flex; gap:8px; align-items:center}
.counter{font-family:var(--f-mono); font-size:12px; color:var(--ink-2); white-space:nowrap}
.counter.over{color:var(--brand); font-weight:600}
.guide{font-size:13px; color:var(--ink-2); display:grid; gap:4px; border-left:3px solid var(--lav); padding-left:10px}
.blanks{display:grid; gap:10px; background:var(--lav-soft); border-radius:8px; padding:12px}
.blanks-h{font-size:12px; font-weight:600; color:var(--ink)}
.blank{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto; gap:8px; align-items:center}
.blank .hint{font-size:13px; color:var(--ink-2)}
.blank .ctl{display:flex; gap:6px; min-width:0}
.blank input{flex:1; min-width:0; padding:7px 9px; border:1px solid var(--rule); border-radius:6px; background:var(--surface)}
.blank select{max-width:130px; padding:6px; border:1px solid var(--rule); border-radius:6px; background:var(--surface); font-size:12px}
@media (max-width:640px){ .blank{grid-template-columns:minmax(0,1fr)} }
.answer label{display:block; font-size:12px; color:var(--ink-3); margin-bottom:4px}
.answer textarea{width:100%; min-height:90px; resize:vertical; border:1px solid var(--rule); border-radius:8px; padding:12px; background:var(--bg); line-height:1.6; font-size:15px; overflow:hidden}

/* facts view */
.fgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px}
.fact{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r); padding:14px; display:grid; gap:6px; align-content:start}
.fact label{font-weight:600; font-size:14px}
.fact .hint{font-size:12px; color:var(--ink-3)}
.fact textarea{width:100%; min-height:44px; resize:vertical; border:1px solid var(--rule); border-radius:6px; padding:8px; background:var(--bg); overflow:hidden}
.fact.filled{border-color:color-mix(in srgb,var(--good) 45%,var(--rule))}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:8px; font-size:14px; font-weight:600; z-index:10}
@media (prefers-reduced-motion: no-preference){ .meter i{transition:width .3s ease} .ri,.btn{transition:background-color .15s,border-color .15s} }
</style>

<header class="top">
  <div class="wrap top-in">
    <div class="mark"><b>Kon <i>Pop</i> Grant Desk</b><span>Fill in each application, blank by blank</span></div>
    <div class="status" id="status" data-s="local" role="status"><i></i><span id="statusText">Loading saved answers…</span></div>
  </div>
</header>

<div class="wrap layout">
  <div class="pick"><label for="pickSel" class="small muted">Application</label><select id="pickSel"></select></div>
  <nav class="rail" id="rail" aria-label="Applications"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="application/json" id="data">__DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const G = DATA.grants, FACTS = DATA.facts;
const FIELDS = {};
G.forEach(g => { let n = 0; g.groups.forEach(gr => gr.fields.forEach(f => { f.key = g.id + "__f" + (n++); FIELDS[f.key] = {g, f}; })); });
const CHIP = {credits:"Now", pandemic:"Confirm", hsri:"Feb–Apr", nrct:"Nov–Apr", pmuc:"Annual", thaihealth:"Open", concept:"Any time"};
const LS = "kpd-grant-desk-v1";
let answers = {}, facts = {}, view = "solve", DL = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const textOf = k => answers[k] ?? FIELDS[k].f.body;
const BL = /\[FILL[^\]]*\]/g, CF = /\[CONFIRM[^\]]*\]/g;
function blanks(t){ return [...t.matchAll(BL)].map(m => ({s:m[0], i:m.index, hint:(m[0].replace(/^\[FILL:?\s*/,"").replace(/\]$/,"").trim() || "Fill in")})); }
function count(t, unit){ return unit === "chars" ? t.length : (t.trim() ? t.trim().split(/\s+/).length : 0); }
function stateOf(k){
  const {f} = FIELDS[k], t = textOf(k), b = blanks(t).length;
  const n = f.limit ? count(t, f.unit) : null, over = !!(f.limit && n > f.limit);
  return {t, b, n, over, ready: !b && !over};
}
function progress(g){
  let total = 0, ready = 0, bl = 0, cf = 0;
  g.groups.forEach(gr => gr.fields.forEach(f => { const s = stateOf(f.key); total++; if(s.ready) ready++; bl += s.b; cf += (s.t.match(CF) || []).length; }));
  return {total, ready, bl, cf};
}
function inline(s){ return esc(s).replace(/\[FILL[^\]]*\]/g, m => "<mark class='fill'>"+m+"</mark>").replace(/\[CONFIRM[^\]]*\]/g, m => "<mark class='confirm'>"+m+"</mark>"); }
function mdLite(lines){
  let html = "", list = null;
  const flush = () => { if(list){ html += "<ul>"+list.join("")+"</ul>"; list = null; } };
  lines.forEach(l => {
    const t = l.trim(); if(!t){ flush(); return; }
    const m = t.match(/^(?:[-*]|\d+\.|☐)\s+(.*)$/);
    if(m) (list = list || []).push("<li>"+inline(m[1])+"</li>"); else { flush(); html += "<p>"+inline(t)+"</p>"; }
  });
  flush(); return html;
}
function daysLeft(iso){ return Math.ceil((new Date(iso) - new Date()) / 864e5); }
function fmtWhen(iso){
  const d = new Date(iso);
  return {
    et: d.toLocaleString("en-US", {timeZone:"America/New_York", weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) + " ET",
    th: d.toLocaleString("en-GB", {timeZone:"Asia/Bangkok", weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) + " Thailand"
  };
}
function chipFor(g){
  if(g.deadline){
    const d = daysLeft(g.deadline);
    if(d < 0) return "<span class='chip'>Closed</span>";
    return "<span class='chip "+(d <= 21 ? "hot" : "lav")+"'>"+(g.estimated ? "~" : "")+d+" days</span>";
  }
  return "<span class='chip'>"+esc(CHIP[g.id] || "")+"</span>";
}
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1800); }
function grow(el){ el.style.height = "auto"; el.style.height = (el.scrollHeight + 2) + "px"; }

/* ---------- storage: shared db for the team, browser storage as fallback ---------- */
function localLoad(){ try{ const o = JSON.parse(localStorage.getItem(LS) || "{}"); answers = o.answers || {}; facts = o.facts || {}; if(o.view) view = o.view; }catch(e){} }
function localSave(){ try{ localStorage.setItem(LS, JSON.stringify({answers, facts, view})); }catch(e){} }
function setStatus(s){
  const m = {db:["db","Saved for everyone with access to this page"], saving:["db","Saving…"], local:["local","Saved in this browser only"],
             readonly:["warn","View only. Ask the owner for edit access."], error:["warn","Couldn't save to the shared page. Kept in this browser."]};
  const [k, t] = m[s] || m.local; $("status").dataset.s = k; $("statusText").textContent = t;
}
const Store = {
  mode:"local", db:null, timers:{}, chains:{}, readonly:false,
  save(kind, id){
    localSave();
    if(this.mode !== "db"){ setStatus("local"); return; }
    if(this.readonly){ setStatus("readonly"); return; }
    setStatus("saving");
    const k = kind+"/"+id; clearTimeout(this.timers[k]);
    this.timers[k] = setTimeout(() => { delete this.timers[k]; this.flush(kind, id); }, 900);
  },
  flush(kind, id){
    const k = kind+"/"+id, ref = this.db.doc(kind+"/"+id);
    const val = kind === "answers" ? answers[id] : facts[id];
    const op = val === undefined ? () => ref.delete() : () => ref.set(kind === "answers" ? {text:val} : {value:val});
    this.chains[k] = (this.chains[k] || Promise.resolve()).then(op)
      .then(() => { if(!Object.keys(this.timers).length) setStatus("db"); })
      .catch(e => { if(e && e.code === "invalid_argument"){ this.readonly = true; setStatus("readonly"); } else setStatus("error"); });
  }
};
function subscribe(kind, target){
  let first = true;
  Store.db.collection(kind).onSnapshot(snap => {
    if(first){
      first = false;
      if(snap.empty && Object.keys(target).length){ Object.keys(target).forEach(id => Store.flush(kind, id)); return; }
    }
    const changed = [];
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id;
      const focused = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.id === id;
      if(Store.timers[kind+"/"+id] || focused) return;
      if(ch.type === "removed") delete target[id];
      else { const d = ch.doc.data() || {}; const v = kind === "answers" ? d.text : d.value; if(typeof v === "string") target[id] = v; }
      changed.push(id);
    });
    if(changed.length){ localSave(); onRemote(kind, changed); }
  }, () => setStatus("error"));
}
function onRemote(kind, ids){
  renderRail();
  if(kind === "facts"){ if(view === "facts") ids.forEach(id => { const el = document.querySelector("[data-fact='"+id+"']"); if(el && document.activeElement !== el){ el.value = facts[id] || ""; grow(el); el.closest(".fact").classList.toggle("filled", !!(facts[id]||"").trim()); } }); return; }
  ids.forEach(id => { if(FIELDS[id] && FIELDS[id].g.id === view) updateField(id, true); });
  if(view !== "facts" && view !== "") updateHeader();
}
async function init(){
  localLoad(); renderRail(); render();
  if(!(window.claude && typeof window.claude.use === "function")){ setStatus("local"); return; }
  try{
    const [db, dl] = await Promise.all([claude.use("db"), claude.use("downloads")]);
    if(dl){ DL = dl; document.body.classList.add("can-dl"); }
    if(!db){ setStatus("local"); return; }
    Store.db = db; Store.mode = "db"; setStatus("db");
    subscribe("answers", answers); subscribe("facts", facts);
  }catch(e){ setStatus("local"); }
}

/* ---------- rail ---------- */
function renderRail(){
  const filled = FACTS.filter(f => (facts[f.key]||"").trim()).length;
  let h = "<button class='ri' data-view='facts' aria-current='"+(view==="facts")+"'><span class='ri-top'><span class='ri-name'>Facts used everywhere</span><span class='chip lav num'>"+filled+"/"+FACTS.length+"</span></span><span class='meter'><i style='width:"+(filled/FACTS.length*100)+"%'></i></span></button>";
  h += "<div class='rail-head caps'>Applications · by deadline</div>";
  G.forEach(g => { const p = progress(g);
    h += "<button class='ri' data-view='"+g.id+"' aria-current='"+(view===g.id)+"'><span class='ri-top'><span class='ri-name'>"+esc(g.short)+"</span>"+chipFor(g)+"</span><span class='meter'><i style='width:"+(p.ready/p.total*100)+"%'></i></span><span class='small muted num'>"+p.ready+" of "+p.total+" ready · "+p.bl+" blanks</span></button>"; });
  $("rail").innerHTML = h;
  $("pickSel").innerHTML = "<option value='facts'>Facts used everywhere ("+filled+"/"+FACTS.length+")</option>" + G.map(g => { const p = progress(g); return "<option value='"+g.id+"'>"+esc(g.short)+" · "+p.ready+"/"+p.total+" ready</option>"; }).join("");
  $("pickSel").value = view;
}
$("rail").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if(b) go(b.dataset.view); });
$("pickSel").addEventListener("change", e => go(e.target.value));
function go(v){ view = v; localSave(); renderRail(); render(); window.scrollTo({top:0}); }

/* ---------- main views ---------- */
function render(){
  if(view === "facts") return renderFacts();
  const g = G.find(x => x.id === view) || G[0]; view = g.id;
  const p = progress(g);
  let when;
  if(g.deadline){
    const w = fmtWhen(g.deadline), d = daysLeft(g.deadline);
    when = "<div class='due'><span class='when'>Due "+esc(w.et)+(g.estimated ? " <span class='chip warn'>estimated: confirm</span>" : "")+"</span><span class='tz'>"+esc(w.th)+"</span>"+(d >= 0 ? "<span class='chip "+(d<=21?"hot":"lav")+" num'>"+d+" days left</span>" : "<span class='chip'>Deadline passed</span>")+"</div>";
  } else when = "<div class='due'><span class='when'>"+esc(g.window || "")+"</span></div>";
  let h = "<div class='ghead'><div class='eyebrow caps'>Applicant · "+esc(g.applicant)+"</div><h1>"+esc(g.short)+"</h1><p class='full'>"+esc(g.title)+"</p>"+when
    + "<div class='facts-row'><div><span>Amount</span><span>"+esc(g.amount)+"</span></div><div><span>Where to submit</span><span>"+esc(g.portal)+"</span></div><div><span>Draft file</span><span>applications/"+esc(g.file)+"</span></div></div>"
    + "<div class='prog' id='gprog'></div>"
    + "<div class='actions'><button class='btn primary' data-act='copyall'>Copy whole application</button><button class='btn dl' data-act='download'>Download as .txt</button><button class='btn quiet' data-act='nextblank'>Jump to next blank</button></div></div>";
  if(g.intro.length) h += "<details class='read'><summary>Read first: rules and notes for this application</summary><div class='notes'>"+mdLite(g.intro)+"</div></details>";
  g.groups.forEach(gr => {
    h += "<div class='group'>" + (gr.title ? "<h2>"+esc(gr.title)+"</h2>" : "") + (gr.note.length ? "<div class='notes'>"+mdLite(gr.note)+"</div>" : "");
    gr.fields.forEach(f => { h += fieldHTML(f); });
    h += "</div>";
  });
  $("main").innerHTML = h;
  $("main").querySelectorAll("textarea[data-id]").forEach(grow);
  updateHeader();
}
function fieldHTML(f){
  const s = stateOf(f.key);
  return "<section class='field"+(s.ready?" is-ready":"")+"' id='fld-"+f.key+"'>"
    + "<div class='fhead'><h3>"+esc(f.title)+"</h3><div class='fmeta' id='meta-"+f.key+"'>"+metaHTML(f, s)+"</div></div>"
    + (f.guide.length ? "<div class='guide'>"+mdLite(f.guide)+"</div>" : "")
    + "<div id='bl-"+f.key+"'>"+blanksHTML(f.key, s.t)+"</div>"
    + "<div class='answer'><label for='ta-"+f.key+"'>Answer · edit freely and rewrite in your own words</label><textarea id='ta-"+f.key+"' data-id='"+f.key+"' spellcheck='true'>"+esc(s.t)+"</textarea></div>"
    + "<div class='actions'><button class='btn' data-act='copy' data-k='"+f.key+"'>Copy answer</button><button class='btn quiet' data-act='reset' data-k='"+f.key+"'>Reset to original draft</button></div>"
    + "</section>";
}
function metaHTML(f, s){
  const c = f.limit ? "<span class='counter"+(s.over?" over":"")+"'>"+s.n+" / "+f.limit+" "+f.unit+"</span>" : "";
  const st = s.b ? "<span class='chip hot'>"+s.b+(s.b===1?" blank":" blanks")+"</span>" : s.over ? "<span class='chip hot'>Over limit</span>" : "<span class='chip good'>Ready</span>";
  return c + st;
}
function blanksHTML(k, t){
  const b = blanks(t); if(!b.length) return "";
  const opts = FACTS.filter(f => (facts[f.key]||"").trim());
  const sel = opts.length ? "<select data-factpick aria-label='Use a saved fact'><option value=''>Use a fact…</option>"+opts.map(f => "<option value='"+f.key+"'>"+esc(f.label)+"</option>").join("")+"</select>" : "";
  return "<div class='blanks'><div class='blanks-h'>Fill "+(b.length===1?"this blank":"these "+b.length+" blanks")+". Each one is placed straight into the answer below.</div>"
    + b.map((x,i) => "<div class='blank' data-k='"+k+"' data-i='"+i+"'><span class='hint'>"+esc(x.hint)+"</span><span class='ctl'><input type='text' aria-label='"+esc(x.hint)+"' id='in-"+k+"-"+i+"'>"+sel+"</span><button class='btn' data-act='fill'>Fill</button></div>").join("")
    + "</div>";
}
function updateField(k, fromRemote){
  const {f} = FIELDS[k], s = stateOf(k);
  const ta = $("ta-"+k); if(!ta) return;
  if(fromRemote || document.activeElement !== ta){ if(ta.value !== s.t){ ta.value = s.t; } grow(ta); }
  $("meta-"+k).innerHTML = metaHTML(f, s);
  $("bl-"+k).innerHTML = blanksHTML(k, s.t);
  $("fld-"+k).classList.toggle("is-ready", s.ready);
}
function updateHeader(){
  const g = G.find(x => x.id === view); if(!g) return;
  const p = progress(g), el = $("gprog"); if(!el) return;
  el.innerHTML = "<span class='big num'>"+p.ready+"/"+p.total+"</span><span class='muted'>answers ready</span><span class='meter'><i style='width:"+(p.ready/p.total*100)+"%'></i></span>"
    + "<span class='chip "+(p.bl?"hot":"good")+" num'>"+p.bl+" blanks left</span>"+(p.cf ? "<span class='chip warn num'>"+p.cf+" to confirm in the official call</span>" : "");
}
function setAnswer(k, t){
  if(t === FIELDS[k].f.body) delete answers[k]; else answers[k] = t;
  Store.save("answers", k); updateField(k, true); updateHeader(); renderRail();
}

/* ---------- events on the grant form ---------- */
$("main").addEventListener("input", e => {
  const ta = e.target.closest("textarea[data-id]:not([data-fact])");
  if(ta){
    const k = ta.dataset.id; answers[k] = ta.value; grow(ta);
    const {f} = FIELDS[k], s = stateOf(k);
    $("meta-"+k).innerHTML = metaHTML(f, s);
    const bl = $("bl-"+k), n = blanks(s.t).length;
    if(bl.querySelectorAll(".blank").length !== n) bl.innerHTML = blanksHTML(k, s.t);
    $("fld-"+k).classList.toggle("is-ready", s.ready);
    Store.save("answers", k); updateHeader(); clearTimeout(renderRail.t); renderRail.t = setTimeout(renderRail, 600);
    return;
  }
  const fa = e.target.closest("textarea[data-fact]");
  if(fa){ const k = fa.dataset.fact; facts[k] = fa.value; grow(fa); fa.closest(".fact").classList.toggle("filled", !!fa.value.trim()); Store.save("facts", k); clearTimeout(renderRail.t); renderRail.t = setTimeout(renderRail, 600); }
});
$("main").addEventListener("change", e => {
  const sel = e.target.closest("select[data-factpick]"); if(!sel || !sel.value) return;
  const row = sel.closest(".blank"); row.querySelector("input").value = facts[sel.value] || ""; sel.value = "";
  row.querySelector("input").focus();
});
$("main").addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.matches(".blank input")){ e.preventDefault(); doFill(e.target.closest(".blank")); }
});
$("main").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act, k = b.dataset.k;
  if(act === "fill") doFill(b.closest(".blank"));
  else if(act === "copy") copyText(textOf(k), "Answer copied");
  else if(act === "reset"){
    if(!b.dataset.confirm){ b.dataset.confirm = "1"; b.textContent = "Click again to reset"; return; }
    delete answers[k]; Store.save("answers", k); updateField(k, true); updateHeader(); renderRail(); toast("Reset to the original draft");
  }
  else if(act === "copyall") copyText(grantText(G.find(g => g.id === view)), "Whole application copied");
  else if(act === "download") download(G.find(g => g.id === view));
  else if(act === "nextblank"){
    const first = [...$("main").querySelectorAll(".blank input")][0];
    if(first){ first.scrollIntoView({block:"center"}); first.focus(); } else toast("No blanks left in this application");
  }
});
function doFill(row){
  const k = row.dataset.k, i = Number(row.dataset.i), v = row.querySelector("input").value.trim();
  if(!v){ row.querySelector("input").focus(); toast("Type the answer for this blank first"); return; }
  const t = textOf(k), b = blanks(t)[i]; if(!b) return;
  setAnswer(k, t.slice(0, b.i) + v + t.slice(b.i + b.s.length));
  const next = $("bl-"+k).querySelector(".blank input"); if(next) next.focus();
}

/* ---------- export ---------- */
function grantText(g){
  const out = [g.title, "Applicant: "+g.applicant, ""];
  g.groups.forEach(gr => {
    if(gr.title) out.push("== "+gr.title+" ==", "");
    gr.fields.forEach(f => out.push("### "+f.title+(f.limit ? " (limit "+f.limit+" "+f.unit+")" : ""), textOf(f.key), ""));
  });
  return out.join("\n");
}
async function copyText(t, msg){
  try{ await navigator.clipboard.writeText(t); toast(msg); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand("copy"); }catch(_){}
    ta.remove(); toast(ok ? msg : "Copy isn't allowed here. Select the text and copy it manually.");
  }
}
async function download(g){
  if(!DL) return;
  try{ await DL.save({filename:"KPD - "+g.short.replace(/[^\w\s.-]/g,"").trim()+".txt", data:grantText(g)}); toast("Saved"); }
  catch(e){ if(e && e.code !== "declined") toast("Couldn't save the file here. Use Copy instead."); }
}

/* ---------- facts view ---------- */
function renderFacts(){
  const filled = FACTS.filter(f => (facts[f.key]||"").trim()).length;
  let h = "<div class='ghead'><div class='eyebrow caps'>Fill once · reuse in every application</div><h1>Facts used everywhere</h1>"
    + "<p class='full'>These are the facts most applications ask for. Enter each one once. Then, next to any blank in an application, pick it from the <b>Use a fact…</b> dropdown to drop it in.</p>"
    + "<div class='prog'><span class='big num'>"+filled+"/"+FACTS.length+"</span><span class='muted'>facts filled in</span><span class='meter'><i style='width:"+(filled/FACTS.length*100)+"%'></i></span></div></div>";
  h += "<div class='fgrid'>" + FACTS.map(f => {
    const v = facts[f.key] || "";
    return "<div class='fact"+(v.trim()?" filled":"")+"'><label for='fact-"+f.key+"'>"+esc(f.label)+"</label>"+(f.hint?"<span class='hint'>"+esc(f.hint)+"</span>":"")+"<textarea id='fact-"+f.key+"' data-fact='"+f.key+"' data-id='"+f.key+"' rows='2'>"+esc(v)+"</textarea></div>";
  }).join("") + "</div>";
  $("main").innerHTML = h;
  $("main").querySelectorAll("textarea[data-fact]").forEach(grow);
}

init();
</script>
