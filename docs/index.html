<title>Kon Pop Grant Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a working desk. Left rail lists the grants (by deadline) with progress; the main column is one grant's form, question by question. Rail becomes a dropdown on phones. */
:root{
  --bg:#F6F4F8; --surface:#FFFFFF; --sunk:#EFEBF4; --ink:#241C2C; --ink-2:#5D5369; --ink-3:#8B8297; --rule:#DED7E7;
  --brand:#B42A3C; --brand-soft:#F8E3E6; --lav:#C6BEDA; --lav-soft:#ECE8F4;
  --good:#2C7A4E; --good-soft:#E1F1E7; --warn:#9E5B00; --warn-soft:#FBEFD8;
  --f-display:"Archivo","Arial Narrow","Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Thai","Segoe UI","Leelawadee UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17131C; --surface:#201A27; --sunk:#2A2333; --ink:#EFEAF4; --ink-2:#B9AFC6; --ink-3:#877D95; --rule:#372E42;
    --brand:#F07A88; --brand-soft:#3D1E25; --lav:#8E84A8; --lav-soft:#2C2639;
    --good:#6CC892; --good-soft:#173023; --warn:#E9AF55; --warn-soft:#33281A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17131C; --surface:#201A27; --sunk:#2A2333; --ink:#EFEAF4; --ink-2:#B9AFC6; --ink-3:#877D95; --rule:#372E42;
  --brand:#F07A88; --brand-soft:#3D1E25; --lav:#8E84A8; --lav-soft:#2C2639;
  --good:#6CC892; --good-soft:#173023; --warn:#E9AF55; --warn-soft:#33281A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0; padding-inline:16px; padding-block:0 64px; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55}
h1,h2,h3{margin:0; text-wrap:balance; line-height:1.2}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--brand); outline-offset:2px}
.wrap{max-width:1240px; margin-inline:auto}
.caps{font-family:var(--f-display); font-stretch:72%; text-transform:uppercase; letter-spacing:.04em; font-weight:700}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* top */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); border-bottom:1px solid var(--rule); margin-inline:-16px; padding-inline:16px}
.top-in{display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; padding-block:12px}
.mark{display:flex; align-items:baseline; gap:10px; margin-right:auto}
.mark b{font-family:var(--f-display); font-stretch:68%; font-weight:800; font-size:24px; letter-spacing:.02em; text-transform:uppercase}
.mark b i{font-style:normal; color:var(--brand)}
.mark span{color:var(--ink-2); font-size:13px}
.status{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2)}
.status i{width:8px; height:8px; border-radius:50%; background:var(--ink-3)}
.status[data-s="db"] i{background:var(--good)}
.status[data-s="warn"] i{background:var(--warn)}

/* layout */
.layout{display:grid; grid-template-columns:270px minmax(0,1fr); gap:28px; padding-block:24px}
.rail{position:sticky; top:calc(env(safe-area-inset-top,0px) + 72px); align-self:start; max-height:calc(100vh - 96px); overflow-y:auto; display:grid; gap:6px; padding-bottom:12px}
.rail-head{font-size:11px; color:var(--ink-3); padding:10px 10px 4px}
.ri{display:grid; gap:6px; text-align:left; width:100%; background:none; border:1px solid transparent; border-radius:8px; padding:9px 10px; cursor:pointer}
.ri:hover{background:var(--surface); border-color:var(--rule)}
.ri[aria-current="true"]{background:var(--surface); border-color:var(--lav); box-shadow:inset 3px 0 0 var(--brand)}
.ri-top{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
.ri-name{font-weight:600; font-size:14px}
.meter{height:5px; border-radius:3px; background:var(--sunk); overflow:hidden}
.meter i{display:block; height:100%; background:var(--good)}
.pick{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr); gap:16px; padding-block:16px}
  .rail{display:none}
  .pick{display:grid; gap:4px}
  .pick select{width:100%; padding:10px; border:1px solid var(--rule); border-radius:8px; background:var(--surface); font-weight:600}
}

/* chips */
.chip{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; background:var(--sunk); color:var(--ink-2); white-space:nowrap}
.chip.hot{background:var(--brand-soft); color:var(--brand)}
.chip.good{background:var(--good-soft); color:var(--good)}
.chip.warn{background:var(--warn-soft); color:var(--warn)}
.chip.lav{background:var(--lav-soft); color:var(--ink)}

/* grant header */
.ghead{display:grid; gap:14px; padding-bottom:20px; border-bottom:1px solid var(--rule); margin-bottom:20px}
.eyebrow{font-size:12px; color:var(--ink-2)}
.ghead h1{font-family:var(--f-display); font-stretch:75%; font-weight:800; font-size:clamp(30px,4.6vw,46px); text-transform:uppercase; letter-spacing:.01em; line-height:1}
.ghead .full{color:var(--ink-2); max-width:70ch}
.due{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:baseline}
.due .when{font-weight:600}
.due .tz{font-size:13px; color:var(--ink-2)}
.facts-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 20px; font-size:13px}
.facts-row div{display:grid; gap:1px}
.facts-row span:first-child{font-size:11px; color:var(--ink-3)}
.prog{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center}
.prog .big{font-family:var(--f-display); font-stretch:75%; font-weight:800; font-size:28px; line-height:1}
.prog .meter{flex:1 1 200px; height:8px}
.actions{display:flex; flex-wrap:wrap; gap:8px}
.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--rule); background:var(--surface); border-radius:8px; padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:var(--surface)}
.btn.quiet{background:none; border-color:transparent; color:var(--ink-2)}
.dl{display:none !important}
.can-dl .dl{display:inline-flex !important}
details.read{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r); padding:12px 16px}
details.read summary{cursor:pointer; font-weight:600}
.notes{display:grid; gap:8px; margin-top:10px; font-size:14px; max-width:78ch}
.notes ul{margin:0; padding-left:20px; display:grid; gap:4px}
mark.fill{background:var(--brand-soft); color:var(--brand); border-radius:3px; padding:0 2px}
mark.confirm{background:var(--warn-soft); color:var(--warn); border-radius:3px; padding:0 2px}

/* groups + fields */
.group{display:grid; gap:14px; margin-top:26px}
.group > h2{font-family:var(--f-display); font-stretch:75%; text-transform:uppercase; letter-spacing:.03em; font-size:18px; color:var(--ink-2); font-weight:700}
.field{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r); padding:18px; display:grid; gap:12px}
.field.is-ready{border-color:color-mix(in srgb,var(--good) 45%,var(--rule))}
.fhead{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:flex-start; justify-content:space-between}
.fhead h3{font-size:16px; font-weight:600; max-width:60ch}
.fmeta{display:flex; gap:8px; align-items:center}
.counter{font-family:var(--f-mono); font-size:12px; color:var(--ink-2); white-space:nowrap}
.counter.over{color:var(--brand); font-weight:600}
.guide{font-size:13px; color:var(--ink-2); display:grid; gap:4px; border-left:3px solid var(--lav); padding-left:10px}
.blanks{display:grid; gap:10px; background:var(--lav-soft); border-radius:8px; padding:12px}
.blanks-h{font-size:12px; font-weight:600; color:var(--ink)}
.blank{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto; gap:8px; align-items:center}
.blank .hint{font-size:13px; color:var(--ink-2)}
.blank .ctl{display:flex; gap:6px; min-width:0}
.blank input{flex:1; min-width:0; padding:7px 9px; border:1px solid var(--rule); border-radius:6px; background:var(--surface)}
.blank select{max-width:130px; padding:6px; border:1px solid var(--rule); border-radius:6px; background:var(--surface); font-size:12px}
@media (max-width:640px){ .blank{grid-template-columns:minmax(0,1fr)} }
.answer label{display:block; font-size:12px; color:var(--ink-3); margin-bottom:4px}
.answer textarea{width:100%; min-height:90px; resize:vertical; border:1px solid var(--rule); border-radius:8px; padding:12px; background:var(--bg); line-height:1.6; font-size:15px; overflow:hidden}

/* facts view */
.fgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px}
.fact{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r); padding:14px; display:grid; gap:6px; align-content:start}
.fact label{font-weight:600; font-size:14px}
.fact .hint{font-size:12px; color:var(--ink-3)}
.fact textarea{width:100%; min-height:44px; resize:vertical; border:1px solid var(--rule); border-radius:6px; padding:8px; background:var(--bg); overflow:hidden}
.fact.filled{border-color:color-mix(in srgb,var(--good) 45%,var(--rule))}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:8px; font-size:14px; font-weight:600; z-index:10}
@media (prefers-reduced-motion: no-preference){ .meter i{transition:width .3s ease} .ri,.btn{transition:background-color .15s,border-color .15s} }
</style>

<header class="top">
  <div class="wrap top-in">
    <div class="mark"><b>Kon <i>Pop</i> Grant Desk</b><span>Fill in each application, blank by blank</span></div>

  </div>
</header>

  <nav class="rail" id="rail" aria-label="Applications"></nav>
  <main id="main"></main>
</div>

[FILL]\nAccelerator/incubator: Harvard GAMI incubator; MIT Hacking Medicine Grand Hack 2025 [FILL: Google award]\n\nWhat does your company do? (~50 words)\nKon Pop Detection builds AI-assisted oral cancer screening for underserved communities. Village health volunteers use our app to photograph the mouth; our fine-tuned MedGemma and YOLO models flag high-risk lesions; and dentists triage patients from a dashboard. We are piloting in northeast Thailand, where oral cancer is common and specialists are scarce.\n\nHow will you use the credits? (~100 words)\n- Fine-tuning MedGemma and training YOLO lesion detectors on [FILL: N] oral images (GPU: [FILL] hours/month)\n- Hosting the inference API and clinician dashboard for ~300 volunteers and [FILL] hospitals\n- Secure, encrypted storage of de-identified images ([FILL] TB) with region-specific hosting to meet Thailand's PDPA\n- Experiment tracking and model monitoring (drift, subgroup performance)\n- Distilling a compact on-device model for low-cost phones\n\nEstimated monthly spend: [FILL: use the provider's pricing calculator: GPU, storage, egress]\n\nTechnical stack: [FILL: app framework; backend; database; ML framework]\n\nImpact: each early-detected oral cancer is usually curable and costs about one fifth as much to treat as late-stage disease."}]}]}, {"id": "solve", "short": "MIT Solve 2027", "deadline": "2026-11-02T12:00:00-05:00", "estimated": false, "applicant": "Kon Pop Detection", "amount": "$10k + prizes up to $150k", "portal": "solve.mit.edu/challenges/2027-global-health-challenge", "title": "MIT Solve 2027 Global Health Challenge – Draft Application (Kon Pop Detection)", "file": "01_MIT_Solve_2027_Global_Health.md", "intro": ["Deadline: Monday 2 November 2026, 12:00 PM (noon) US Eastern, NOT end of day. Submit early; you can keep editing after submitting.", "Prize: US$10,000 Solver grant + eligibility for sponsor prizes (e.g. AI for Humanity Prize, up to $150,000; Crescent Enterprises AI for Social Innovation Prize, up to $100,000). Average Solver funding ~$40k.", "Challenge question: \"How can we use technology to make good health and quality care more equitable for all?\"", "Apply: https://solve.mit.edu/challenges/2027-global-health-challenge", "", "⚠️ Solve's rules on AI-written applications: Solve \"does not recommend using generative AI tools to write your application\", and you must tick a box confirming nothing is fabricated or exaggerated. Use this draft as raw material. Rewrite every answer in your own words and voice, add your real stories, and replace every [FILL]. Solve reviewers want to hear the founders' passion and first-hand experience.", "⚠️ Answers in \"Page 1: Solution Profile\" become public if you reach Semifinalist.", "Run python check_limits.py applications\\01_MIT_Solve_2027_Global_Health.md to check word limits after editing."], "groups": [{"title": "PAGE 1 – Solution Profile (public if Semifinalist)", "note": [], "fields": [{"title": "Name of your organization", "limit": null, "unit": null, "guide": [], "body": "Kon Pop Detection [FILL: exact legal name, e.g. \"Kon Pop Detection, Inc.\"]"}, {"title": "Name of your solution", "limit": 30, "unit": "chars", "guide": [], "body": "Kon Pop Detection"}, {"title": "One-line summary", "limit": 150, "unit": "chars", "guide": [], "body": "AI-assisted smartphone screening that helps village health volunteers find oral cancer early and fast-track high-risk patients."}, {"title": "City/town/region of headquarters", "limit": null, "unit": null, "guide": [], "body": "[FILL: e.g. Cambridge, MA, or the city where the company is registered and the senior team is based]"}, {"title": "Country of headquarters", "limit": null, "unit": null, "guide": [], "body": "[FILL: United States / Thailand – must match where the company is registered]"}, {"title": "Type of organization", "limit": null, "unit": null, "guide": [], "body": "For-profit [FILL: confirm]"}, {"title": "Elevator pitch video (≤ 2 minutes, public YouTube/Vimeo link)", "limit": null, "unit": null, "guide": [], "body": "[FILL: link] Strongly recommended. Suggested 2-minute script:\n1. (0:00–0:20) Ernest: why this matters personally (both parents had cancer).\n2. (0:20–0:50) Dr. Wareekul at a community screening: volunteers with one day of training and a paper form.\n3. (0:50–1:30) Live demo: register a patient → take 3 photos → AI marks the lesion → dentist dashboard shows the prioritised case.\n4. (1:30–2:00) Pilot in Health Region 10, what you need from Solve."}, {"title": "What specific problem are you solving?", "limit": 200, "unit": "words", "guide": [], "body": "Oral cancer kills about 177,000 people every year, and the burden falls hardest on South and Southeast Asia, where betel quid, tobacco and alcohol use are common. Caught early, oral cancer is usually curable with surgery. Caught late, survival drops sharply and treatment costs roughly five times more: about US$2,027 vs US$394 per patient per year in a Malaysian public-hospital study.\n\nIn rural Thailand, the first and often only screening contact is a village health volunteer. Volunteers receive about one day of training, record risk factors on a paper form, and must judge by eye which mouth lesions need a dentist. Paper results move slowly to hospitals. Dentists see both missed cancers and many unnecessary referrals. Patients referred unnecessarily lose wages and travel long distances, and genuinely high-risk patients can be lost to follow-up.\n\nIn Health Region 10 in northeast Thailand (Ubon Ratchathani, Sisaket, Yasothon, Amnat Charoen, Mukdahan), [FILL: number of adults aged 40+ eligible for oral cancer screening; number of dentists per population; % of oral cancers diagnosed at late stage, with source].\n\nWe are solving the gap between the first community contact and a fast, accurate referral."}, {"title": "What is your solution?", "limit": 200, "unit": "words", "guide": [], "body": "Kon Pop Detection turns a volunteer's smartphone into an oral cancer screening tool.\n\nA trained volunteer registers the patient, records risk factors (tobacco, alcohol, betel quid) in the app instead of on paper, and takes three standardised photos of the mouth. Our AI checks image quality, marks suspicious areas and produces a risk score. It combines Google's MedGemma medical foundation model, fine-tuned on our oral-lesion images, with a YOLO lesion-detection model.\n\nResults flow to a dashboard where hospital dentists review cases ranked by risk and bring high-risk patients in first for examination and biopsy. The app runs on low-cost phones and copes with patchy internet [FILL: describe how, e.g. \"photos are stored on the phone and upload automatically when a signal returns\"].\n\nVolunteers learn with a picture-based training manual and a training game that teaches them to take usable photos and recognise warning signs.\n\nThe AI does not diagnose. It supports the volunteer's decision to refer and the dentist's decision on who to see first, and a clinician confirms every high-risk result.\n\n[FILL: demo video link, if separate from the pitch video]"}, {"title": "Who does your solution serve, and in what ways will it impact their lives?", "limit": 200, "unit": "words", "guide": [], "body": "We serve adults aged 40 and over in rural northeast Thailand, especially people who chew betel quid, smoke or drink alcohol. Many are farmers or older adults living far from a hospital dentist; in our region betel chewing remains common among older rural women, while smoking and drinking are more common among men. Today their only screening is a short visual check by a volunteer with one day of training, and if referred they may travel hours and lose a day's income.\n\nWith Kon Pop Detection:\n- Patients are more likely to have a dangerous lesion noticed early, when treatment is simpler, cheaper and usually curative, and less likely to make an unnecessary trip.\n- Village health volunteers, who are mostly women, get a tool that makes their screening more accurate and their work more valued, replacing paper forms with a simple app.\n- Hospital dentists in short supply see the highest-risk patients first instead of a long, unsorted referral list.\n\nIn our pilot we aim to reach [FILL: number] adults through [FILL: number, e.g. 300] volunteers linked to [FILL: 3–4] hospitals [FILL: names, e.g. Hua Taphan Hospital, Amnat Charoen]."}, {"title": "Checkboxes (internal)", "limit": null, "unit": null, "guide": [], "body": "☐ Terms of Service / Media Release / Privacy Policy ☐ AI-tools processing notice ☐ No fabricated or exaggerated information. Check every number before ticking."}]}, {"title": "PAGE 2 – Eligibility", "note": [], "fields": [{"title": "Is technology a core part of your solution?", "limit": null, "unit": null, "guide": [], "body": "Yes, tech is core to our solution."}, {"title": "Does your solution address a health or healthcare access problem?", "limit": null, "unit": null, "guide": [], "body": "Yes"}, {"title": "What is your solution's stage of development?", "limit": null, "unit": null, "guide": ["Choose honestly. Pilot = launched in at least one community, still iterating (often 10+ users). Prototype = working version still being tested, little or no investment raised. If the Health Region 10 pilot has started screening real patients with volunteers, choose Pilot. If only \"mini pilots\" have happened, consider Prototype."], "body": "[FILL: Pilot / Prototype]"}, {"title": "Why did you select this stage? What have you built and tested so far?", "limit": 200, "unit": "words", "guide": [], "body": "We have a working app and AI model, and we are piloting them with real volunteers and patients in northeast Thailand.\n\nBuilt so far:\n- Volunteer mobile app: patient registration, digital risk-factor survey, guided three-photo capture\n- Dentist dashboard that ranks screened patients by AI risk score\n- AI model (fine-tuned MedGemma + YOLO detector) trained on [FILL: number] oral images from [FILL: sources]\n- A training game for learning to recognise lesions and take good photos\n\nTested so far:\n- Internal validation: [FILL: e.g. \"sensitivity __% and specificity __% for high-risk lesions on __ held-out images, compared with specialist diagnosis/biopsy\"]\n- Mini-pilots: [FILL: number] people screened at [FILL: places/dates]; in one case [FILL: a short, factual description of the patient whose lesion was found early, without identifying details]\n- Ethics approval from [FILL: committee name, approval number/date]\n- Agreements with [FILL: number] hospitals in Health Region 10\n- Pilot launch: [FILL: date; volunteers trained so far; people screened so far]\n\nWe call this a [FILL: Pilot/Prototype] because [FILL: e.g. \"the tool is in use in one region but we are still refining the model and training approach based on volunteer feedback\"]."}]}, {"title": "PAGE 3 – Solution & Team Details", "note": [], "fields": [{"title": "How many beneficiaries or customers does your solution currently serve?", "limit": null, "unit": null, "guide": [], "body": "[FILL: choose honestly: 0 / 1–10 / 11–100 / 101–1,000 / 1,001–10,000 …]"}, {"title": "Website, app, or social media", "limit": null, "unit": null, "guide": [], "body": "[FILL: website / app store / LinkedIn link. If none, upload proof such as company registration, a hospital MOU, or a 1-minute demo video]"}, {"title": "Which dimension of the Challenge does your solution most closely address?", "limit": null, "unit": null, "guide": ["This is the strongest fit: you equip village health volunteers, cut unnecessary travel, and replace paper forms. The alternative is \"Improve prevention and management of noncommunicable diseases\"."], "body": "Expand quality primary care to vulnerable communities by supporting frontline health workers or reducing cost, distance, and administrative barriers."}, {"title": "How are you and your team well-positioned to deliver this solution?", "limit": 300, "unit": "words", "guide": ["Solve wants lived experience and engagement with the community, not credentials. Give real numbers and examples."], "body": "Our team brings together the clinic, the community and the code.\n\nDr. Narawitchz Wareekul, our Chief Medical Officer, is a dentist with Mahidol University [FILL: exact role] who has taken part in community oral cancer screening in rural Thailand alongside village health volunteers. [FILL: how many screening events/years; what he saw first-hand.] He saw that volunteers have about one day of training and a paper form, and that dentists receive referrals too late or for harmless lesions.\n\nErnest Choi, our CEO, is a Harvard graduate student and three-time founder. His drive is personal: both of his parents have had cancer.\n\nAmir Fleurizard, our CTO, is a full-stack engineer (M.Sc., UNC Charlotte) who built our app, dashboard and AI pipeline.\n\nWe designed the tool with the people who will use it. [FILL: e.g. \"We interviewed/observed __ volunteers and __ dentists at __ hospitals.\"] What we learned changed the product:\n- Volunteers asked for instructions with pictures rather than text, because of language and literacy needs, so our training manual is picture-based.\n- Training cascades through 20 fully trained lead volunteers who train their peers, matching how volunteer networks already work.\n- [FILL: one more concrete design change from user feedback, e.g. the three-photo protocol, the risk survey, or offline use.]\n\nWe are supported by hospital partners in Health Region 10 [FILL: names], Mahidol University, and the Harvard Global Alliance for Medical Innovation (GAMI) incubator. We also collaborate with MIT and the University of Michigan [FILL: what each contributes]. We hold ethics approval [FILL: details] and began the pilot in [FILL: month/year]."}, {"title": "In which countries do you currently operate?", "limit": null, "unit": null, "guide": [], "body": "Thailand [FILL: plus United States, if the company is based there]"}, {"title": "Additional countries in the next year", "limit": null, "unit": null, "guide": [], "body": "[FILL: e.g. none, or Malaysia / Cambodia / Laos / India, only if there is a real plan]"}, {"title": "How many people work on your solution team?", "limit": 100, "unit": "words", "guide": [], "body": "[FILL: e.g. \"3 co-founders (part-time/full-time?), __ part-time contributors, __ volunteer trainers; plus partner-hospital staff who are not employees.\"]"}, {"title": "How long have you been working on your solution?", "limit": 100, "unit": "words", "guide": [], "body": "Since early 2025. The team formed at MIT Hacking Medicine's Grand Hack in [FILL: month] 2025, where we won [FILL: exact name of Google award]. We incorporated Kon Pop Detection in November 2025 [FILL: confirm] and have worked on the solution for about [FILL: 1.5] years."}, {"title": "Why are you applying to Solve?", "limit": 200, "unit": "words", "guide": ["Solve says: if your only goal is money, Solve is not the right fit. Name specific non-financial barriers."], "body": "We have a working tool and a pilot. To reach national scale, we need help with four barriers:\n\n1. Clinical validation and evidence. We need advice on designing a rigorous multi-site validation, with biopsy-confirmed outcomes, that the Thai Ministry of Public Health and international funders will trust.\n2. Regulatory pathway. Our AI is likely to be regulated as Software as a Medical Device in Thailand. We need guidance and partners to navigate approval efficiently.\n3. Government partnerships and business model. Our long-term buyers are public health systems and insurers. We want introductions to and coaching on selling to governments, including Thailand's MOPH and NHSO, and later other South and Southeast Asian health ministries.\n4. Responsible AI and technical scale. We want expert review of bias across sex, age and device type, privacy-preserving data handling, and access to compute to retrain our model as data grow.\n\nFunding would let us train more volunteers and extend the pilot from Health Region 10 to Regions 7 and 9. Solve's network of health-system, AI and impact-investor partners is exactly what we lack."}, {"title": "Team Lead", "limit": null, "unit": null, "guide": ["The Team Lead must attend Solver Orientation at MIT on 14–15 April 2027 and Solve Challenge Finals in New York in September."], "body": "Ernest Choi (CEO) [FILL: email, phone with country code; backup contact: e.g. Dr. Wareekul or Amir Fleurizard]"}, {"title": "Previously selected as a Solver?", "limit": null, "unit": null, "guide": [], "body": "No [FILL: confirm]"}, {"title": "Active or past participant in another entrepreneurship network?", "limit": null, "unit": null, "guide": [], "body": "Yes: MIT Hacking Medicine Grand Hack 2025; Harvard Global Alliance for Medical Innovation (GAMI) incubator [FILL: others, e.g. Harvard Innovation Labs]"}]}, {"title": "PAGE 4 – More About Your Solution and Business Model", "note": [], "fields": [{"title": "What makes your solution innovative?", "limit": 300, "unit": "words", "guide": [], "body": "Most AI oral-cancer tools are built on images from well-equipped hospitals, taken by specialists under good lighting. They tend to perform worse in villages, on cheap phones, in poor light. Kon Pop Detection is designed the other way round: for the conditions of community screening.\n\nWhat is new:\n1. Built into the existing volunteer system. We do not create a new screening programme; we upgrade the one Thailand already runs. Volunteers keep their role, and the app replaces the paper risk form they already use, so adoption needs little change in behaviour.\n2. Foundation-model approach for small, diverse data. We fine-tune Google's MedGemma, a medical foundation model, and pair it with a YOLO detector that localises lesions. This lets us learn from fewer images and produce visual explanations (a box on the suspicious area) that volunteers and dentists can check.\n3. Image-quality checks at the point of capture. The app flags blurry or badly framed photos while the patient is still there, so dentists receive usable images. [FILL: confirm this is built or planned]\n4. Triage, not just detection. The dentist dashboard ranks patients by risk, so scarce specialist time goes to those who need it most and unnecessary trips are avoided.\n5. Training game and picture-based manual that make one day of training go further.\n\nBroader impact: the volunteer-AI-dashboard workflow and our image-acquisition standards can be reused for other conditions that volunteers screen for. Our evaluation of cost per screen and per high-risk case referred will give health ministries evidence for buying AI-assisted primary-care screening. Other mobile oral screening efforts exist in the region, such as MeMoSA in Malaysia; we see them as potential partners in building shared standards and regional datasets."}, {"title": "Theory of change: how and why will your solution have an impact?", "limit": 300, "unit": "words", "guide": [], "body": "Activities: train volunteers (cascade from 20 lead trainers); volunteers screen adults aged 40+ with the app; AI scores images; dentists triage through the dashboard; high-risk patients are referred and tracked to biopsy.\n\nOutputs: number of people screened; % of photos meeting quality standards; number of high-risk patients identified and referred; time from screening to dentist review.\n\nShort-term outcomes: more accurate referrals (more true high-risk lesions found, fewer unnecessary referrals); shorter time to diagnosis; higher volunteer confidence.\n\nLong-term outcomes: more oral cancers diagnosed at an early stage; lower mortality; lower costs for patients and the health system; AI-assisted screening adopted in national programmes.\n\nEvidence for the links:\n- A large cluster-randomised trial in Kerala, India showed that visual oral screening by trained health workers reduced oral cancer deaths among tobacco and alcohol users (Sankaranarayanan et al., *Lancet* 2005). Screening by non-specialists can work, but accuracy depends heavily on training (Cochrane review, Walsh et al. 2021). Our tool targets exactly that weakness.\n- Early-stage treatment costs about one fifth of late-stage treatment (Raman et al., *PLoS One* 2021, Malaysia).\n- Our own data: [FILL: model accuracy, pilot feedback, e.g. \"volunteers rated usability __/100; __% of photos met quality standards\"].\n\nKey assumptions we test in the pilot: volunteers can take usable photos after training; the model performs well on community images; referred patients actually attend."}, {"title": "Tech stack and how you know it works", "limit": 300, "unit": "words", "guide": ["Solve asks for \"proof that it works in the form of an academic paper or some other form of publicly available evidence.\" If you have none yet, consider posting a short validation report or preprint (e.g. on medRxiv) before the deadline, or link the Grand Hack/Google award page."], "body": "- Mobile app (volunteers): [FILL: e.g. Flutter/React Native/Kotlin], Thai-language interface, guided three-photo capture, digital risk survey, [FILL: offline storage and sync]\n- Clinician dashboard (web/tablet): [FILL: framework]; secure login; patient list ranked by risk; image viewer with AI annotations\n- AI: Google MedGemma (Health AI Developer Foundations) fine-tuned for oral-lesion risk classification, plus a YOLO [FILL: version] object detector for lesion localisation; image-quality check model [FILL]\n- Data & infrastructure: [FILL: cloud provider and region; encryption; de-identification; where data are stored and who owns them]\n- Training data: [FILL: number of images, sources, how labelled (dentists? biopsy?)]\n\nHow we know it works:\n- [FILL: validation results with numbers: sensitivity, specificity, AUC, test-set size, comparison standard]\n- [FILL: pilot usability results]\n- [FILL: link to any public evidence: preprint, poster, hackathon page, Google award announcement]\n\nTechnologies used (tick): Machine Learning; Generative AI (MedGemma is a generative model; tick only if you use its text or vision-language capabilities); Imaging and Sensor Technology; Software and Mobile Applications; Big Data [FILL: only if accurate]"}, {"title": "What is your business model?", "limit": 300, "unit": "words", "guide": [], "body": "Customers (who pays): hospitals and public health systems. In Thailand these are provincial and district hospitals, Health Region offices and the Ministry of Public Health, and potentially the National Health Security Office (NHSO), which funds preventive services. Later customers include health ministries and insurers elsewhere in South and Southeast Asia, and private dental networks.\n\nBeneficiaries (who uses it, free of charge): village health volunteers and the patients they screen.\n\nWhat we provide: a software-as-a-service package: the volunteer app, the AI risk scoring, the dentist dashboard, training materials and the training game, and reporting for programme managers.\n\nWhy they want it: public systems already pay for volunteer screening and for treating late-stage cancer. Our tool makes the screening they already fund more accurate and reduces costly late-stage treatment and wasted referrals.\n\nHow we deliver: we pilot with partner hospitals, show results, then sign per-region contracts priced [FILL: e.g. per screen / per facility per year / per region], with training delivered through lead volunteers.\n\nPrimary customer type: Government (B2G) [or B2B if hospitals contract directly; FILL: choose one]"}, {"title": "What is your plan for becoming financially sustainable, and what evidence do you have?", "limit": 300, "unit": "words", "guide": [], "body": "Phase 1 (now to 2027): grants and non-dilutive funding to complete validation and the pilot. Received so far: [FILL: Google award amount; GAMI support; any grants]. Applications in progress: [FILL: e.g. NIH SBIR, HSRI, Harvard President's Innovation Challenge].\n\nPhase 2 (2027–2028): first paid contracts with hospitals and Health Region offices in Thailand once the pilot shows accuracy and cost savings. [FILL: any letters of intent or pricing discussions.]\n\nPhase 3: national and regional scale through government contracts (MOPH/NHSO) and expansion to other high-burden countries.\n\nInvestment: we are raising [FILL: amount and type, e.g. pre-seed; Regulation Crowdfunding] to support the team between grants and contracts. Raised to date: [FILL].\n\nWhy the economics work: treating late-stage oral cancer costs about five times more than early-stage treatment, so a modest price per screen can be repaid by a small number of cancers caught earlier. Our Aim 3 cost-effectiveness analysis will measure this directly and support procurement decisions.\n\n[FILL: evidence of success so far: awards with amounts, in-kind support (compute credits, hospital staff time), revenue if any.]"}]}, {"title": "Before you submit – checklist", "note": ["- ☐ Every [FILL] replaced; every number checked against a source", "- ☐ Answers rewritten in your own voice (Solve penalises generic AI-sounding text)", "- ☐ Word/character limits checked (python check_limits.py ...)", "- ☐ 2-minute video uploaded and set to public", "- ☐ Team Lead available 14–15 April 2027 (Cambridge, MA)", "- ☐ Submitted before 12:00 noon ET, 2 Nov 2026 (= midnight 00:00, 3 Nov, Thailand time)"], "fields": []}]}, {"id": "nsf", "short": "NSF SBIR pitch", "deadline": "2026-11-04T17:00:00-05:00", "estimated": true, "applicant": "Kon Pop Detection", "amount": "Phase I ~$305k", "portal": "seedfund.nsf.gov", "title": "NSF SBIR/STTR Phase I – Project Pitch Draft (Kon Pop Detection)", "file": "05_NSF_SBIR_Project_Pitch.md", "intro": ["What it is: NSF's \"America's Seed Fund\". You first submit a short Project Pitch. If NSF invites you, you then submit a full Phase I proposal (historically up to ~$305k [CONFIRM current amount]).", "Status: SBIR/STTR reauthorised in April 2026. Grants.gov lists NSF 26-511 (SBIR/STTR Phase I, Phase II, Fast-Track, \"a pilot emphasis on scientific instrumentation\") with a close date of 4 Nov 2026. Read the solicitation: if the current round emphasises scientific instrumentation, a digital-health AI pitch may not fit this cycle [CONFIRM at seedfund.nsf.gov, along with whether Project Pitches are open and which topics]", "Topic to select: Digital Health, or Artificial Intelligence [CONFIRM current topic names]", "Eligibility: same as SBIR generally: US small business, > 50% US-owned, PI primarily employed by the company at award, and R&D performed in the US. NSF funds technical innovation with high technical risk, not clinical trials or pilots.", "", "NSF reviewers want technical risk: what is hard, unproven, and worth funding? Focus on the robustness, on-device AI, and quality-gating research, not on the Thai pilot logistics.", "", "Character limits below are from past NSF Project Pitch forms [CONFIRM]."], "groups": [{"title": "", "note": [], "fields": [{"title": "1. The Technology Innovation", "limit": 3500, "unit": "chars", "guide": [], "body": "Kon Pop Detection is developing an AI triage system that lets non-specialist health workers detect high-risk oral lesions from smartphone photographs taken in community settings. The core innovation is making medical-image AI reliable outside the clinic: on low-cost phones, under uncontrolled lighting, operated by minimally trained users, with intermittent connectivity.\n\nOur approach combines (1) a medical foundation model (Google's MedGemma) fine-tuned for oral-lesion risk classification, which allows strong performance from limited labelled data; (2) a YOLO-based detector that localises suspicious areas, giving an interpretable output that users can verify; (3) an image-quality gate that evaluates each photo at capture and prompts the user to retake unusable images; and (4) calibrated risk scores that drive a triage queue for clinicians.\n\nThis differs from existing oral-cancer AI research, which mostly trains and tests on specialist-acquired hospital images and reports accuracy that does not transfer to field conditions. Our system is designed for the conditions where most oral cancers are missed: community screening in high-burden, low-resource regions and underserved primary-care settings. Success would enable scalable, low-cost screening programmes and create a reusable framework for robust point-of-care image AI.\n\n[FILL: 1–2 sentences on current prototype status and preliminary results]"}, {"title": "2. The Technical Objectives and Challenges", "limit": 3500, "unit": "chars", "guide": [], "body": "Objective 1: robustness to acquisition variability. *Challenge:* model accuracy drops with device, lighting, angle and blur. *R&D:* device- and lighting-stratified evaluation; physics-informed augmentation; test-time quality gating; site-held-out validation. *Target:* AUC drop ≤ [FILL] between best and worst strata.\n\nObjective 2: reliable, calibrated triage with explainability. *Challenge:* foundation-model outputs can be over-confident; users need to understand where the lesion is. *R&D:* calibration methods (e.g. temperature scaling, conformal prediction to produce \"refer / do not refer / retake\" sets with guaranteed error rates); detector-based localisation. *Target:* calibration error ≤ [FILL]; sensitivity ≥ [FILL]% for high-risk lesions at specificity ≥ [FILL]%.\n\nObjective 3: efficient on-device or low-bandwidth inference. *Challenge:* the large foundation model is too heavy for low-cost phones and weak networks. *R&D:* knowledge distillation into a compact model; quantisation; hybrid on-device quality check with deferred cloud scoring. *Target:* on-device quality check < [FILL] s on a US$[FILL] phone; full result within [FILL] minutes after connectivity resumes.\n\nObjective 4: subgroup fairness. *Challenge:* performance may vary by sex, age and mucosal pigmentation. *R&D:* stratified evaluation and mitigation. *Target:* no subgroup sensitivity more than [FILL] points below overall."}, {"title": "3. The Market Opportunity", "limit": 1750, "unit": "chars", "guide": [], "body": "Oral cancer causes ~177,000 deaths per year. Most occur in South and Southeast Asia, where public health systems already run community screening using non-specialist workers; Thailand alone has more than a million village health volunteers. Late-stage treatment costs about five times more than early-stage treatment, so payers have a direct economic incentive to improve early detection. Customers are public health systems, hospitals and insurers (B2G/B2B software-as-a-service, priced per screen or per site). In the US, dental and primary-care practices and community health centres serving high-risk populations, plus teledentistry platforms, are a secondary market. [FILL: pricing hypothesis; market size with sources; customer discovery done, e.g. \"__ interviews with hospital directors and dentists\"]"}, {"title": "4. The Company and Team", "limit": 1750, "unit": "chars", "guide": [], "body": "Kon Pop Detection was founded in [FILL: month] 2025 after the team won [FILL: Google award] at MIT Hacking Medicine's Grand Hack, and it is part of the Harvard GAMI incubator.\n- CTO Amir Fleurizard (M.Sc., UNC Charlotte) built the app, dashboard and AI pipeline [FILL: AI/ML experience].\n- CEO Ernest Choi is a Harvard graduate student and three-time founder.\n- CMO Dr. Narawitchz Wareekul is a dentist at Mahidol University with community screening experience.\n\nCollaborators include MIT, the University of Michigan, and partner hospitals in Thailand. [FILL: incorporation state; which founder would be the PI and their employment status with KPD]"}]}]}, {"id": "pic", "short": "Harvard PIC", "deadline": "2026-12-07T23:59:00-05:00", "estimated": true, "applicant": "Kon Pop Detection (Harvard student on team)", "amount": "Share of ~$500k prize pool", "portal": "innovationlabs.harvard.edu/presidents-innovation-challenge", "title": "Harvard President's Innovation Challenge (PIC) 2027 – Draft Application (Kon Pop Detection)", "file": "03_Harvard_Presidents_Innovation_Challenge.md", "intro": ["Track: Health Care + Life Sciences (digital health / health IT)", "Prize pool: non-dilutive. The 2025 pool was ~$517,000 across winners and finalists.", "Deadline: not yet published. The 2026 cycle closed 8 Dec 2025, so expect early December 2026 [CONFIRM at innovationlabs.harvard.edu/presidents-innovation-challenge]", "Eligibility: the team must include a current Harvard student (Ernest Choi qualifies) [CONFIRM: role requirements, e.g. that the student is a founder/team lead, and rules on prior funding/revenue]", "Apply: apply.innovationlabs.harvard.edu (PIC programme)", "", "The exact 2027 questions are not published yet. The sections below cover what PIC applications have asked for: problem, solution, market, competition, business model, traction, team, milestones and use of funds. Map them onto the real form when it opens. Rewrite in your own voice; PIC judges are entrepreneurs and investors."], "groups": [{"title": "", "note": [], "fields": [{"title": "Venture name & one-liner", "limit": null, "unit": null, "guide": [], "body": "Kon Pop Detection. AI-assisted smartphone screening that helps community health volunteers catch oral cancer early."}, {"title": "The problem", "limit": null, "unit": null, "guide": [], "body": "Oral cancer kills about 177,000 people a year, mostly in South and Southeast Asia, where betel quid, tobacco and alcohol are common. Caught early it is usually curable; caught late, survival is poor and treatment costs about five times more. In Thailand, the first and often only screening is done by village health volunteers with about one day of training and a paper form. Dentists are scarce, referrals are slow and unsorted, cancers are missed, and patients make long, unnecessary trips."}, {"title": "The solution", "limit": null, "unit": null, "guide": [], "body": "A volunteer app plus a dentist dashboard. Volunteers record risk factors and take three mouth photos. Our AI (fine-tuned Google MedGemma + YOLO lesion detector) flags suspicious areas and scores risk. Dentists see a ranked list and bring high-risk patients in first. It runs on cheap phones, copes with patchy internet, and comes with a picture-based training manual and a training game."}, {"title": "Customer & market", "limit": null, "unit": null, "guide": [], "body": "- Users: village health volunteers and hospital dentists. Buyers: hospitals, Health Region offices, the Thai Ministry of Public Health and National Health Security Office, then health ministries and insurers across South and Southeast Asia.\n- Market sizing (from our deck): TAM US$2.4B (oral cancer diagnosis), SAM US$1.1B (South Asia), SOM US$75M. [FILL: show how each number was calculated (number of people screened × price, or diagnostic spend) and cite the sources. Judges will ask.]\n- Beachhead: Thailand. More than one million village health volunteers already deliver community screening, so we sell into a programme that already exists."}, {"title": "Competition & advantage", "limit": null, "unit": null, "guide": [], "body": "- Status quo: paper forms and an unaided eye\n- Other mobile/AI oral screening: e.g. MeMoSA (Malaysia), academic models\n- Our edge: built for community conditions (cheap phones, variable light) and trained on images from those settings; fits the existing volunteer workflow; triage dashboard for scarce dentists; local clinical leadership and hospital partners; foundation-model approach.\n- [FILL: defensibility: data partnerships, hospital contracts, regulatory approval, model performance.]"}, {"title": "Business model", "limit": null, "unit": null, "guide": [], "body": "B2G/B2B software-as-a-service: per-region or per-facility subscription, or per-screen pricing [FILL: pricing hypothesis, e.g. US$__ per screen]. Volunteers and patients use it free. Early revenue comes from hospital and Health Region pilots converting to contracts; non-dilutive grants fund validation."}, {"title": "Traction", "limit": null, "unit": null, "guide": [], "body": "- MIT Hacking Medicine Grand Hack 2025: team formed; [FILL: Google award name/amount]\n- Harvard GAMI incubator\n- Hospital approvals in Thailand; ethics approval [FILL]\n- MVP built and validated [FILL: metrics]\n- Mini-pilots: [FILL: people screened; the early-detection case, described factually]\n- Health Region 10 pilot: [FILL: volunteers trained / people screened to date]\n- Funding to date: [FILL]"}, {"title": "Team", "limit": null, "unit": null, "guide": [], "body": "- Ernest Choi, CEO: Harvard graduate student [FILL: school/programme]; three-time founder; personal motivation (both parents had cancer)\n- Dr. Narawitchz Wareekul, CMO: dentist, Mahidol University; leads clinical work and community screening\n- Amir Fleurizard, CTO: full-stack engineer, M.Sc. UNC Charlotte; built the app, dashboard and AI pipeline\n- Advisors/collaborators: [FILL: GAMI, MIT, University of Michigan mentors]"}, {"title": "Milestones (next 12 months)", "limit": null, "unit": null, "guide": [], "body": "By | Milestone\nQ1 2027 | Pilot analysis: accuracy, usability, referral completion in Health Region 10\nQ2 2027 | External validation at a new hospital; Thai FDA pre-submission consultation\nQ3 2027 | Expansion to Health Regions 7 and 9; first paid contract [FILL target]\nQ4 2027 | Cost-effectiveness results to MOPH/NHSO; seed round [FILL]"}, {"title": "Use of funds (if awarded)", "limit": null, "unit": null, "guide": [], "body": "Item | Amount\nVolunteer training and devices for pilot expansion | [FILL]\nBiopsy follow-up and validation study costs | [FILL]\nCloud compute and data security | [FILL]\nRegulatory consultation (Thai FDA) | [FILL]\nTotal | [FILL]"}, {"title": "Why now / why us", "limit": null, "unit": null, "guide": [], "body": "Foundation models make accurate AI possible with locally collected data, and smartphones are now universal among volunteers. Our team pairs a Thai clinician embedded in community screening with builders who have shipped products."}, {"title": "Video / pitch deck", "limit": null, "unit": null, "guide": ["Fix in the deck before submitting:", "- \"Why so many in South Asia?\" shows Thailand, which is Southeast Asia. Use \"South and Southeast Asia\".", "- \"74% of oral cancer deaths occur in South Asia\": check the cited paper. It may say Asia, not South Asia.", "- \"100% screening done without technology\": soften or cite.", "- \"Terabytes of training data\" and the competitor ✓/✗ table: be ready to back these up with numbers. Judges and Solve both penalise exaggeration.", "- Replace the \"distracted boyfriend\" meme on the business model slide with a pricing/customer slide for formal applications."], "body": ""}]}]}, {"id": "nih", "short": "NIH STTR / SBIR", "deadline": "2027-01-05T17:00:00-05:00", "estimated": true, "applicant": "Kon Pop Detection + US university", "amount": "Phase I ~$300k", "portal": "seed.nih.gov · grants.nih.gov (PA-27-102 / PA-27-100)", "title": "NIH / NCI SBIR or STTR Phase I – Draft Application (Kon Pop Detection)", "file": "04_NIH_NCI_SBIR_STTR_Phase_I.md", "intro": ["Programme status: SBIR/STTR authority lapsed 30 Sep 2025 and was reauthorised through 30 Sep 2031 (Small Business Innovation and Economic Security Act of 2026, signed 13 Apr 2026). NIH is accepting applications again.", "Next standard due date: 5 January 2027 (then 5 Apr and 5 Sep) [CONFIRM in the NIH Guide]", "Opportunity (found on Grants.gov, Oct 2026):", "- PA-27-102: NIH Small Business Technology Transfer Grant (Parent STTR [R41/R42], Clinical Trial Optional), listed close 5 Apr 2027 ← recommended", "- PA-27-100: NIH, CDC and FDA Small Business Innovation Research Grant (Parent SBIR [R43/R44], Clinical Trial Optional), listed close 5 Apr 2027", "- PAR-27-039 / PAR-27-040: Small Business Transition Grant for New Entrepreneurs (R43/R44 and R41/R42). Check whether an early-career founder qualifies [CONFIRM eligibility]", "- Also check NCI-specific SBIR topics/contracts (seed.nih.gov, NCI SBIR Development Center)", "Phase I budget guideline: about US$300k total costs [CONFIRM the current SBA guideline amount and NCI's limits]; ~6–12 months", "New 2026 rules: each small business may submit at most 9 SBIR/STTR applications per fiscal year to HHS; expanded foreign-ties disclosure and due diligence (NOT-OD-26-073/-074/-075) [CONFIRM]"], "groups": [{"title": "", "note": [], "fields": [{"title": "⚠️ Eligibility gate – answer these BEFORE writing", "limit": null, "unit": null, "guide": ["Recommendation: apply as an STTR (R41) with the University of Michigan, Harvard, or MIT as the research institution, with a faculty PI or multi-PI. US-based technical aims are funded by NIH; Thai partners supply de-identified images under a data-use agreement, with their collection funded separately. Email the NCI SBIR Development Center programme director with a 1-page summary before writing.", "NIH and AI-written applications: NIH does not consider applications \"substantially developed by AI\" to be the applicants' original ideas (NOT-OD-25-132). Use this as a structure and rewrite the science yourselves."], "body": "Requirement | KPD status | OK?\nFor-profit small business, ≤ 500 employees, place of business in the US | [FILL: where is KPD incorporated?] | ☐\n> 50% owned and controlled by US citizens or permanent residents (or a permitted structure) | [FILL: ownership by citizenship] | ☐\nRegistered in SAM.gov (UEI), SBA Company Registry (SBC Control ID), Grants.gov, eRA Commons | [FILL] | ☐\nSBIR: PI's primary employment (> 50%) is with KPD at the time of award. A full-time Harvard student may not qualify; consider Amir Fleurizard (CTO) as PI if employed > 50% | [FILL] | ☐\nSTTR alternative: partner with a US research institution (Harvard, MIT, or the University of Michigan). KPD does ≥ 40% of the work and the institution ≥ 30%. The PI may be employed by the research institution | [FILL: which institution and PI] | ☐\nWork performed in the US. SBIR/STTR-funded R&D must normally be performed in the US; foreign performance requires strong justification and agency approval | Plan: fund US-based model development, software and analysis with NIH; fund Thai field data collection and the pilot through Thai grants (HSRI/NRCT/PMU) | ☐\nDisclose all foreign affiliations and support (e.g. Mahidol collaboration, Thai hospital data agreements) |  | ☐"}, {"title": "Project title", "limit": null, "unit": null, "guide": [], "body": "Robust AI triage of oral potentially malignant and malignant lesions from community-acquired smartphone images"}, {"title": "Project Summary/Abstract (≤ 30 lines) – draft", "limit": null, "unit": null, "guide": [], "body": "Oral cancer causes ~177,000 deaths annually, concentrated in South and Southeast Asia and in underserved populations with tobacco, alcohol and areca-nut exposure, including immigrant communities in the US. Survival depends on early detection, yet screening in low-resource and primary-care settings relies on unaided visual inspection by non-specialists, which has variable accuracy. Kon Pop Detection (KPD) has developed a mobile app and clinician dashboard that use a fine-tuned medical foundation model (MedGemma) and a lesion detector (YOLO) to triage intraoral photographs taken by non-specialists. Before clinical deployment, the key technical risk is robustness: performance must hold across low-cost devices, variable lighting, image quality and patient subgroups. In this Phase I project we will (Aim 1) build a quality-controlled, multi-site, biopsy-referenced image dataset and an automated image-quality assessment model; (Aim 2) develop and benchmark robust risk-stratification models with calibrated, explainable outputs; and (Aim 3) conduct a reader study comparing non-specialist accuracy with and without AI assistance. Success criteria: [FILL: e.g. AUC ≥ 0.__, sensitivity ≥ __% at specificity ≥ __% on external test data; ≤ __-point AUC drop across device/lighting strata; ≥ __% improvement in non-specialist sensitivity with AI]. Phase II will conduct prospective multi-site clinical validation and prepare a regulatory submission."}, {"title": "Project Narrative (3 sentences)", "limit": null, "unit": null, "guide": [], "body": "Oral cancer is often found too late because primary-care and community screeners lack tools to recognise high-risk lesions. This project develops an AI tool that helps non-specialists photograph the mouth and identify which patients need urgent specialist review. It could make early detection of oral cancer cheaper and more accessible for underserved populations in the US and worldwide."}, {"title": "Specific Aims (1 page) – draft", "limit": null, "unit": null, "guide": [], "body": "Opening. Oral cancer is highly curable when detected early, but most patients in high-burden, low-resource settings are diagnosed at late stage. Screening by non-specialists can reduce mortality, but its accuracy varies widely with training. AI image analysis could standardise screening, but current models are trained mostly on specialist-acquired hospital images and degrade on low-cost devices and variable field conditions.\n\nLong-term goal: a validated, low-cost, regulatory-cleared AI triage tool for oral cancer screening in primary-care and community settings.\nPhase I objective: demonstrate the technical feasibility of robust, calibrated AI triage on community-acquired smartphone images.\n\nAim 1. Build a quality-controlled, biopsy-referenced dataset and an automated image-quality gate.\nHarmonise [FILL: N] de-identified intraoral images from [FILL: sources] with histopathology or expert-panel reference labels; develop an image-quality classifier that rejects unusable photos at capture.\n*Milestone:* ≥ [FILL] labelled images; quality-gate AUC ≥ [FILL].\n\nAim 2. Develop and benchmark robust risk-stratification models.\nFine-tune MedGemma and train a YOLO lesion detector; compare against baseline CNNs; apply domain-robustness methods (augmentation for lighting and device; site-held-out validation); calibrate risk scores; generate lesion-localisation explanations.\n*Milestone:* external (site-held-out) AUC ≥ [FILL]; sensitivity ≥ [FILL]% at specificity ≥ [FILL]%; calibration slope 0.9–1.1; performance reported by sex, age, device and lighting.\n\nAim 3. Reader study of AI-assisted non-specialist triage.\n[FILL: N] non-specialist readers (e.g. community health workers, dental hygienists, general practitioners) classify [FILL: N] cases with and without AI assistance.\n*Milestone:* AI assistance improves reader sensitivity by ≥ [FILL] percentage points without reducing specificity by more than [FILL].\n\nExpected outcome: a technically de-risked model and software ready for prospective clinical validation in Phase II."}, {"title": "Research Strategy (6 pages): outline with key content", "limit": null, "unit": null, "guide": [], "body": "Significance (~1 page): burden; failure of unaided visual screening; limitations of hospital-trained AI; relevance to US underserved populations (e.g. South/Southeast Asian immigrant communities who use areca nut; rural primary care) and to NCI global oncology priorities.\nInnovation (~½ page): foundation-model fine-tuning for oral lesions; robustness to community acquisition; quality gate at point of capture; triage design for non-specialists.\nApproach (~4.5 pages):\n- Preliminary data: [FILL: dataset, current metrics, MVP screenshots, ethics, hospital agreements]\n- Aim 1–3 methods, statistics (sample-size justification for AUC/sensitivity CIs; reader-study design and analysis, e.g. multi-reader multi-case analysis), go/no-go criteria\n- Rigour: pre-registered analysis plan; site-held-out test set locked before final evaluation; TRIPOD+AI and STARD reporting\n- Potential problems and alternatives\n- Timeline (Gantt)\n- Human subjects: de-identified secondary data → possibly exempt or \"not human subjects research\" [CONFIRM with IRB]; reader study needs consent from readers"}, {"title": "Other components", "limit": null, "unit": null, "guide": [], "body": "- Biosketches (SciENcv Common Form) for PI(s) and key personnel\n- Letters of support: research institution (STTR); Thai data providers (data-use agreement); clinical advisors; potential customers (letters of interest)\n- Facilities & Other Resources: KPD (US office, compute); research institution\n- Budget: KPD and research-institution shares meeting STTR percentages; cloud compute; reader honoraria; no foreign performance unless approved\n- Data Management & Sharing Plan: de-identified data under controlled access respecting Thai PDPA and data-use agreements; model card\n- SBIR/STTR Information form; SBA Company Registry certificate; foreign-disclosure items\n- Phase II only: Commercialisation Plan (12 pages)"}, {"title": "Commercialisation potential (short paragraph for the Significance section)", "limit": null, "unit": null, "guide": [], "body": "Initial market: public screening programmes in Thailand (Ministry of Public Health / NHSO) and other South and Southeast Asian health systems. US opportunity: dental and primary-care practices and federally qualified health centres serving high-risk populations; teledentistry platforms. Revenue: SaaS per screen or per site. Regulatory path: Thai FDA (Software as a Medical Device); US FDA strategy to be determined in Phase II (e.g. De Novo or 510(k), depending on predicates) [FILL/CONFIRM]."}]}]}, {"id": "nrct", "short": "NRCT (วช.)", "deadline": null, "window": "Expected Nov 2026 – Apr 2027", "applicant": "Mahidol University (Dr. Wareekul)", "amount": "Varies", "portal": "nrct.go.th · NRIIS", "title": "NRCT (วช.) – Draft Proposal: Multi-site Validation of an AI Model for Oral Cancer Risk Detection from Community Smartphone Images", "file": "07_NRCT_Thailand.md", "intro": ["Applicant (PI): Dr. Narawitchz Wareekul, Mahidol University [FILL]. KPD is the technology collaborator.", "Submission: NRIIS (Thai), certified by Mahidol's research office before the deadline. NRCT calls for FY2571 funding are expected roughly Nov 2026–Apr 2027 [CONFIRM the programme/topic, e.g. medical & public health, AI, or ageing society].", "How this differs from the HSRI proposal: NRCT gets the scientific/technical validation (dataset, model accuracy, external validation, reader study). HSRI gets the health-system implementation and cost-effectiveness. Funders check for overlap, so keep the aims distinct and declare both applications."], "groups": [{"title": "", "note": [], "fields": [{"title": "ชื่อโครงการ", "limit": null, "unit": null, "guide": [], "body": "TH: การพัฒนาและตรวจสอบความถูกต้องของแบบจำลองปัญญาประดิษฐ์สำหรับประเมินความเสี่ยงมะเร็งช่องปากจากภาพถ่ายสมาร์ทโฟนในการคัดกรองระดับชุมชน: การศึกษาแบบพหุสถาบัน\nEN: Development and multi-site validation of an AI model for oral cancer risk assessment from community smartphone images"}, {"title": "บทคัดย่อ (draft; check wording with a native speaker)", "limit": null, "unit": null, "guide": [], "body": "การคัดกรองมะเร็งช่องปากในชุมชนอาศัยการตรวจด้วยตาโดยบุคลากรที่ไม่ใช่ผู้เชี่ยวชาญ ซึ่งมีความแม่นยำแตกต่างกันมาก แบบจำลองปัญญาประดิษฐ์ที่มีอยู่ส่วนใหญ่พัฒนาจากภาพถ่ายในโรงพยาบาล จึงอาจใช้ไม่ได้ดีกับภาพที่ถ่ายด้วยสมาร์ทโฟนราคาประหยัดในสภาพแสงที่หลากหลายในชุมชน โครงการนี้จะสร้างชุดข้อมูลภาพช่องปากที่มีผลการวินิจฉัยอ้างอิงจากทันตแพทย์ผู้เชี่ยวชาญและผลชิ้นเนื้อจากโรงพยาบาล [FILL] แห่ง พัฒนาแบบจำลองโดยปรับแต่งโมเดลพื้นฐานทางการแพทย์ (MedGemma) ร่วมกับโมเดลตรวจจับรอยโรค (YOLO) และตรวจสอบความถูกต้องกับข้อมูลจากโรงพยาบาลที่ไม่ได้ใช้ในการฝึก รวมทั้งศึกษาผลของการใช้ปัญญาประดิษฐ์ช่วยต่อความแม่นยำของ อสม. และบุคลากรสาธารณสุข ผลลัพธ์ที่คาดหวังคือแบบจำลองที่ผ่านการตรวจสอบความถูกต้องพร้อมสำหรับการใช้งานจริง (TRL 6) ชุดข้อมูลมาตรฐาน และบทความวิชาการ"}, {"title": "หลักการและเหตุผล (Rationale)", "limit": null, "unit": null, "guide": [], "body": "Use HSRI §1 (burden, current screening model). Add the technical gap: published oral-lesion AI is trained on clinical/specialist images, generalises poorly to community conditions, and is rarely validated externally in Thailand. A Thai, multi-site, biopsy-referenced dataset and an externally validated model do not yet exist [FILL: verify with a literature search; cite the closest Thai studies]."}, {"title": "วัตถุประสงค์ (Objectives)", "limit": null, "unit": null, "guide": [], "body": "1. Build a standardised, multi-site oral image dataset with reference-standard labels (dentist panel + histopathology)\n2. Develop and internally validate the AI model (risk classification + lesion localisation + image-quality gate)\n3. Externally validate the model at a hospital not used in training, with performance reported by device, lighting, sex and age\n4. Measure the effect of AI assistance on the accuracy of volunteers and non-specialist health workers (reader study)"}, {"title": "ขอบเขต (Scope)", "limit": null, "unit": null, "guide": [], "body": "[FILL: number of hospitals and images; time period; exclusions]"}, {"title": "ระเบียบวิธีวิจัย (Methods)", "limit": null, "unit": null, "guide": [], "body": "- Data: retrospective archived images + prospective standardised capture (3 views per patient) at [FILL] hospitals; target [FILL] images including ≥ [FILL] histologically confirmed OPMD/cancer\n- Labelling: two calibrated dentists label independently, a third adjudicates; biopsy results take precedence; inter-rater kappa reported\n- Model: fine-tune MedGemma; YOLO detector; quality classifier; calibration; train/validation/test split by patient, external test by hospital\n- Metrics: AUC, sensitivity, specificity, PPV/NPV with 95% CI; calibration; subgroup analysis; TRIPOD+AI and STARD reporting\n- Reader study: [FILL: N] volunteers/health workers × [FILL: N] cases, with vs without AI, analysed with a multi-reader multi-case method\n- Ethics & data: Mahidol EC + site approvals; Thai PDPA; de-identification; data-sharing agreement; Thai institutions own patient data"}, {"title": "TRL / SRL", "limit": null, "unit": null, "guide": [], "body": "TRL [FILL: e.g. 4 → 6]; SRL [FILL: e.g. 3 → 5]"}, {"title": "ผลผลิต / ผลลัพธ์ / ผลกระทบ (Outputs / Outcomes / Impact)", "limit": null, "unit": null, "guide": [], "body": "- Outputs: validated model; dataset with standard protocol; ≥ [FILL] international publications; model card; image-acquisition standard\n- Outcomes: the model is ready for implementation studies (HSRI) and Thai FDA submission\n- Impact: earlier diagnosis; Thai capability in medical AI"}, {"title": "งบประมาณ (Budget)", "limit": null, "unit": null, "guide": [], "body": "Thai government categories as in the HSRI file. Emphasise labelling/expert time, histopathology, data management, compute (or credits), and publication."}, {"title": "ความสอดคล้องกับแผนด้าน ววน. (Alignment)", "limit": null, "unit": null, "guide": [], "body": "[FILL: cite the current NRCT/TSRI programme or OKR the call names, e.g. medical & health innovation, AI for health]"}, {"title": "Attachments", "limit": null, "unit": null, "guide": [], "body": "☐ NRIIS profiles ☐ Hospital letters ☐ Collaboration agreement with KPD (IP, data, conflict of interest) ☐ Ethics status ☐ CVs"}]}]}, {"id": "r21", "short": "NIH R21 (academic)", "deadline": "2027-02-16T17:00:00-05:00", "estimated": true, "applicant": "A university (UMich / Harvard / MIT / Mahidol)", "amount": "Up to $275k direct over 2 years", "portal": "grants.nih.gov · PA-25-253", "title": "NIH PA-25-253 Exploratory Grants in Cancer Control (R21) – Draft Specific Aims (academic-led)", "file": "11_NIH_R21_PA-25-253_academic.md", "intro": ["Use only if a university leads (e.g. University of Michigan, Harvard, or Mahidol as a foreign applicant). For KPD itself, the SBIR/STTR route (file 04) fits better.", "Next realistic due date: 16 Feb 2027 (standard R21 date) [CONFIRM]. Budget ≤ $275k direct over 2 years.", "Critical scope rule: developing new diagnostic technology is non-responsive. This R21 must study screening delivery (cancer control / health-care delivery research) using the existing KPD tool.", "Foreign partners: NIH no longer funds foreign subawards in new applications. Ask the NCI programme officer how Thai sites can take part (unfunded collaborators / consultants / the PF5 international structure). See templates/10.", "", "NIH does not treat AI-written applications as original (NOT-OD-25-132). Rewrite before use."], "groups": [{"title": "", "note": [], "fields": [{"title": "Title", "limit": null, "unit": null, "guide": [], "body": "Feasibility and effectiveness of AI-assisted oral cancer screening delivered by community health volunteers in northeast Thailand"}, {"title": "Specific Aims (draft)", "limit": null, "unit": null, "guide": [], "body": "Oral cancer is a leading cause of cancer death in South and Southeast Asia and among some underserved US populations who use areca nut and tobacco. Screening by trained non-specialists can reduce oral cancer mortality, but its effectiveness is limited by variable examiner accuracy, scarce specialists, and weak referral pathways. Thailand's national programme relies on more than a million village health volunteers who screen adults aged 40+ using a paper risk form after about one day of training. A low-cost smartphone tool with AI triage and remote dentist review (Kon Pop Detection) could improve referral accuracy and speed, but its real-world feasibility, effect on the care pathway, and costs are unknown.\n\nObjective: to evaluate the feasibility and early effectiveness of AI-assisted volunteer screening with remote triage, compared with standard paper-based screening, in Health Region 10, Thailand.\n\nAim 1. Feasibility and acceptability. Among ~300 volunteers and [FILL] adults screened across [FILL] districts, measure recruitment, image-quality pass rate, time per screen, usability (SUS), and acceptability to volunteers, dentists and patients (mixed methods).\n\nAim 2. Care-pathway effectiveness. Compare AI-assisted districts with matched standard-screening districts [FILL design: stepped-wedge or matched comparison] on (a) positive predictive value of referrals, (b) referral completion, and (c) time from screening to specialist evaluation and biopsy.\n\nAim 3. Costs. Estimate cost per screen and cost per high-risk lesion appropriately referred, from health-system and patient perspectives, to inform a future R01 pragmatic trial and policy decisions.\n\nImpact: effect sizes, feasibility parameters and costs to design a definitive pragmatic trial (PAR-25-167 successor), and a model for AI-assisted cancer screening by community health workers transferable to other low-resource and underserved settings."}]}]}, {"id": "hsri", "short": "HSRI (สวรส.)", "deadline": null, "window": "Expected Feb–Apr 2027", "applicant": "Mahidol University (Dr. Wareekul)", "amount": "Varies", "portal": "hsri.or.th · NRIIS", "title": "HSRI (สวรส.) – Draft Proposal: AI-Assisted Oral Cancer Screening by Village Health Volunteers in Health Region 10", "file": "06_HSRI_Thailand.md", "intro": ["Applicant (PI): Dr. Narawitchz Wareekul, Mahidol University [FILL: faculty/position]. HSRI funds Thai institutions, not foreign companies. KPD participates as technology partner/collaborator.", "Submission: NRIIS + Mahidol's research-management system, in Thai. HSRI's annual call has opened around Feb–Apr; the FY2571 call is expected ~Feb–Apr 2027 [CONFIRM]. Contact the HSRI programme officer early.", "Form: HSRI provides separate forms for health-systems research (งานวิจัยเชิงระบบ) and clinical research (งานวิจัยทางคลินิก). Use the health-systems form. This proposal is about the screening *service model*, referral efficiency and cost.", "Why HSRI fits best among Thai funders: HSRI funds research that changes how the Thai health system delivers services, and Objective 3 (cost-effectiveness) and the Health Region 10 implementation are exactly that.", "", "Below: Thai title and abstract (draft, please have a native-speaking team member check the wording) + English section drafts to translate into the HSRI form."], "groups": [{"title": "", "note": [], "fields": [{"title": "ชื่อโครงการ (Title)", "limit": null, "unit": null, "guide": [], "body": "TH: การพัฒนาและประเมินระบบคัดกรองมะเร็งช่องปากด้วยปัญญาประดิษฐ์โดยอาสาสมัครสาธารณสุขประจำหมู่บ้าน (อสม.) ในเขตสุขภาพที่ 10: การศึกษาความเป็นไปได้ ความแม่นยำ และความคุ้มค่า\nEN: Development and evaluation of AI-assisted oral cancer screening by village health volunteers in Health Region 10: feasibility, accuracy and cost-effectiveness"}, {"title": "บทคัดย่อ (Thai abstract, draft)", "limit": null, "unit": null, "guide": [], "body": "มะเร็งช่องปากเป็นปัญหาสาธารณสุขสำคัญในภาคตะวันออกเฉียงเหนือของประเทศไทย ซึ่งมีปัจจัยเสี่ยงสูง เช่น การเคี้ยวหมาก การสูบบุหรี่ และการดื่มแอลกอฮอล์ ผู้ป่วยส่วนใหญ่ได้รับการวินิจฉัยในระยะลุกลาม ทำให้อัตราการรอดชีวิตต่ำและค่าใช้จ่ายในการรักษาสูง ปัจจุบันการคัดกรองในชุมชนดำเนินการโดย อสม. ซึ่งได้รับการอบรมเพียงประมาณ 1 วัน และบันทึกข้อมูลด้วยแบบฟอร์มกระดาษ ส่งผลให้ความแม่นยำในการคัดกรองแตกต่างกันมาก และมีทั้งการพลาดรอยโรคที่มีความเสี่ยงสูงและการส่งต่อที่ไม่จำเป็น โครงการนี้จะพัฒนาและประเมินแอปพลิเคชัน Kon Pop Detection ซึ่งให้ อสม. ถ่ายภาพช่องปากด้วยสมาร์ทโฟน และใช้ปัญญาประดิษฐ์ประเมินความเสี่ยง พร้อมระบบแดชบอร์ดให้ทันตแพทย์จัดลำดับความเร่งด่วนในการตรวจ การศึกษาจะดำเนินการในเขตสุขภาพที่ 10 ร่วมกับโรงพยาบาล [FILL] แห่ง และ อสม. ประมาณ 300 คน โดยประเมิน (1) ความแม่นยำของระบบเทียบกับการตรวจโดยทันตแพทย์และผลชิ้นเนื้อ (2) ความเป็นไปได้และการยอมรับในการใช้งานจริง และ (3) ต้นทุนและความคุ้มค่าเมื่อเทียบกับการคัดกรองแบบเดิม ผลการศึกษาจะนำไปสู่ข้อเสนอเชิงนโยบายต่อกระทรวงสาธารณสุขและสำนักงานหลักประกันสุขภาพแห่งชาติ เพื่อขยายผลการคัดกรองมะเร็งช่องปากด้วยปัญญาประดิษฐ์ในระดับเขตและระดับประเทศ"}, {"title": "คำสำคัญ (Keywords)", "limit": null, "unit": null, "guide": [], "body": "มะเร็งช่องปาก; ปัญญาประดิษฐ์; การคัดกรอง; อาสาสมัครสาธารณสุขประจำหมู่บ้าน; ความคุ้มค่า; เขตสุขภาพที่ 10 / oral cancer; artificial intelligence; screening; village health volunteers; cost-effectiveness"}, {"title": "1. ความสำคัญและที่มาของปัญหา (Problem & health-system significance)", "limit": null, "unit": null, "guide": [], "body": "- Burden: oral cancer incidence and mortality in Thailand and the northeast [FILL: GLOBOCAN 2022 Thailand figures; Thai Cancer Registry; late-stage % from Health Region 10 hospitals]\n- Risk factors in Health Region 10: betel quid chewing (especially older women), tobacco, alcohol [FILL: local survey data if available]\n- Current service model: Thailand's oral cancer screening for adults aged 40+. Village health volunteers complete a paper risk questionnaire (smoking, alcohol, betel, ill-fitting dentures) and refer at-risk people to a doctor, dentist or dental nurse. Volunteers receive about one day of training.\n- System problems:\n  1. Variable accuracy of visual screening by non-specialists (Cochrane review, Walsh et al. 2021)\n  2. Scarce dentists in the region [FILL: dentist-to-population ratio in Region 10 provinces]\n  3. Paper data delays and no prioritisation\n  4. Patient costs from unnecessary referrals, and loss to follow-up of true positives\n- Cost to the system: late-stage treatment costs about five times more than early-stage (US$2,027 vs US$394 per patient per year, Malaysia; Raman et al. 2021) [FILL: Thai costing data if available, e.g. UCS reimbursement for oral cancer surgery and radiotherapy]"}, {"title": "2. คำถามการวิจัย (Research questions)", "limit": null, "unit": null, "guide": [], "body": "1. How accurate is AI-assisted screening by village health volunteers, compared with dentist examination and biopsy, in Health Region 10?\n2. Is AI-assisted screening feasible and acceptable within the existing volunteer–sub-district health promoting hospital (รพ.สต.)–community hospital referral system?\n3. What is the cost per screen and per high-risk case appropriately referred, and is AI-assisted screening cost-effective for the Universal Coverage Scheme compared with the paper-based approach?"}, {"title": "3. วัตถุประสงค์ (Objectives)", "limit": null, "unit": null, "guide": [], "body": "1. To evaluate the diagnostic accuracy of the Kon Pop Detection AI tool in community screening (sensitivity/specificity for high-risk lesions)\n2. To evaluate implementation outcomes (reach, adoption, fidelity, image quality, usability, referral completion, time to dentist review)\n3. To estimate costs and cost-effectiveness from the payer (UCS/NHSO) and societal perspectives\n4. To develop policy recommendations and an implementation guide for expansion to Health Regions 7 and 9 and nationally"}, {"title": "4. กรอบแนวคิด (Conceptual framework)", "limit": null, "unit": null, "guide": [], "body": "[Diagram] Community screening (volunteer + app) → AI risk score + image quality check → dentist dashboard triage (community/district hospital) → specialist examination → biopsy → treatment\nIndicators at each step: coverage; % usable images; % high-risk; positive predictive value; referral completion; time to diagnosis; stage at diagnosis; cost."}, {"title": "5. ระเบียบวิธีวิจัย (Methods)", "limit": null, "unit": null, "guide": [], "body": "- Design: mixed-methods implementation study with an embedded diagnostic accuracy study and economic evaluation. Comparator: [FILL: before/after comparison with historical paper-based screening in the same districts, or comparison districts using standard screening]\n- Setting: Health Region 10, [FILL: provinces/districts]; hospitals [FILL: e.g. Hua Taphan Hospital (Amnat Charoen) + others]; linked sub-district health promoting hospitals (รพ.สต.)\n- Participants: adults aged ≥ 40 screened by volunteers; ~300 volunteers; dentists/dental nurses at participating hospitals\n- Sample size: [FILL: based on expected prevalence of high-risk lesions and target precision for sensitivity (e.g. ± 10%); explain]\n- Reference standard: examination by a dentist blinded to the AI result; biopsy when clinically indicated; expert-panel review of images for screen-negative samples [FILL: e.g. random __% sample of negatives examined]\n- Implementation outcomes: RE-AIM framework: volunteer adoption, fidelity, usability (System Usability Scale), time per screen, image-quality pass rate, referral completion, time from screen to dentist review\n- Economic evaluation: micro-costing of screening, training, devices, software, referrals and biopsies; cost per screen; cost per high-risk case referred; decision model of lifetime costs and QALYs using Thai cost and survival data, following Thai HTA guidelines [FILL: cite HITAP guideline]; budget-impact analysis for the region\n- Qualitative: focus groups with volunteers, dentists and patients; interviews with Provincial Health Office and Health Region 10 managers\n- Gender analysis: all outcomes disaggregated by sex and age"}, {"title": "6. ผลที่คาดว่าจะได้รับและการนำไปใช้ประโยชน์ (Expected results & policy use)", "limit": null, "unit": null, "guide": [], "body": "Output (ผลผลิต) | Outcome (ผลลัพธ์) | Impact (ผลกระทบ)\nAccuracy & implementation report; cost-effectiveness report; policy brief; implementation guide; trained volunteer trainers (20) and volunteers (300) | Health Region 10 decides on expansion; NHSO considers financing; referral efficiency improves | More early-stage diagnoses; lower mortality and treatment costs; a national model for AI-assisted primary-care screening\n\nUsers of results: Health Region 10 office; Provincial Health Offices; Department of Health (Bureau of Dental Health) [CONFIRM unit]; NHSO; participating hospitals."}, {"title": "7. แผนการดำเนินงาน (Work plan, 18 months [CONFIRM HSRI duration])", "limit": null, "unit": null, "guide": [], "body": "Months | Activity\n1–3 | Ethics approvals (Mahidol + sites), data agreements, protocol, staff\n2–4 | Train 20 lead trainers → 300 volunteers; baseline data\n4–10 | Screening and data collection; referral tracking\n8–14 | Accuracy analy
