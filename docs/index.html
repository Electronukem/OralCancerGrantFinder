sis; qualitative study; costing\n12–16 | Economic model; policy brief; implementation guide\n16–18 | Stakeholder workshop (Regions 7, 9, 10); final report"}, {"title": "8. งบประมาณ (Budget, Thai government categories) [FILL amounts]", "limit": null, "unit": null, "guide": ["Conflict of interest: KPD is a company that may profit from adoption. State this, and keep the accuracy and cost analyses under Mahidol/hospital investigators, ideally with an independent statistician. HSRI reviewers will look for this."], "body": "หมวด | รายการ | บาท\nค่าตอบแทน | Volunteer compensation for training/screening days; expert reviewers; focus-group participants |\nค่าจ้าง | Project coordinator; research assistants (×[FILL]); data manager |\nค่าวัสดุ | Biopsy and histopathology consumables; printing training manuals |\nค่าใช้สอย | Training workshops; travel to districts; patient travel support for referral; cloud hosting and data security |\nค่าครุภัณฑ์ | Smartphones for volunteers [justify or source elsewhere] |\nค่าธรรมเนียมอุดหนุนสถาบัน | Mahidol overhead [CONFIRM rate] |\nรวม |  |"}, {"title": "9. การเผยแพร่และผลักดันเชิงนโยบาย (Dissemination & policy translation)", "limit": null, "unit": null, "guide": [], "body": "Policy brief (Thai) to Health Region 10 and NHSO; presentation at the Health Region service-plan committee; academic publications; open implementation guide."}, {"title": "Attachments checklist", "limit": null, "unit": null, "guide": [], "body": "☐ NRIIS registration (PI and co-investigators) ☐ Letters from hospital directors [FILL] ☐ Letter from Health Region 10 / Provincial Health Office ☐ Ethics approval or submission evidence ☐ CVs (Thai) ☐ Collaboration agreement with KPD (data, IP, conflict of interest)"}]}]}, {"id": "pmuc", "short": "PMU-C (บพข.)", "deadline": null, "window": "Annual call: confirm dates", "applicant": "Mahidol + KPD as co-funding partner", "amount": "Varies", "portal": "pmuc.or.th · NRIIS", "title": "PMU-C (บพข.) – Draft Proposal: Commercialisation of Kon Pop Detection as a Thai AI Medical Device for Oral Cancer Screening", "file": "08_PMU-C_Thailand.md", "intro": ["Why PMU-C: PMU-C funds research that becomes a product with a market, typically with a private-sector partner contributing co-funding (in-cash and/or in-kind). KPD is that private partner; Mahidol University leads the research.", "Applicant: Mahidol University (PI: Dr. Narawitchz Wareekul) + KPD as industry partner [CONFIRM whether PMU-C requires the private partner to be a Thai-registered company. If KPD is US-registered, you may need a Thai subsidiary or Thai partner company.]", "Submission: NRIIS (Thai); often a concept proposal first [CONFIRM programme platform (medical/health industry, digital/AI), co-funding %, deadline]"], "groups": [{"title": "", "note": [], "fields": [{"title": "ชื่อโครงการ", "limit": null, "unit": null, "guide": [], "body": "TH: การพัฒนาต้นแบบผลิตภัณฑ์ซอฟต์แวร์ทางการแพทย์ปัญญาประดิษฐ์ Kon Pop Detection สำหรับคัดกรองมะเร็งช่องปาก สู่การขึ้นทะเบียนและใช้งานเชิงพาณิชย์\nEN: Developing the Kon Pop Detection AI medical software for oral cancer screening toward regulatory registration and commercial deployment"}, {"title": "Product", "limit": null, "unit": null, "guide": [], "body": "A software-as-a-service medical device: volunteer mobile app (risk survey + guided photo capture + image-quality check), AI risk scoring (fine-tuned MedGemma + YOLO), and clinician triage dashboard, plus training materials."}, {"title": "Problem & customer need", "limit": null, "unit": null, "guide": [], "body": "See HSRI §1. Customers: community and provincial hospitals, Health Region offices, the MOPH, NHSO, and private dental networks; later, export to ASEAN and South Asian health systems."}, {"title": "Market", "limit": null, "unit": null, "guide": [], "body": "- Thailand: [FILL: number of hospitals and sub-district health promoting hospitals (รพ.สต.) running oral cancer screening; adults aged 40+ targeted each year; price per screen → annual market]\n- Regional: pitch deck figures, TAM US$2.4B / SAM US$1.1B / SOM US$75M [FILL: show calculation and sources]"}, {"title": "Competitive landscape", "limit": null, "unit": null, "guide": [], "body": "Paper-based screening (status quo); MeMoSA (Malaysia) and academic models. KPD's differentiation: built on Thai community images, fits the volunteer workflow, triage dashboard, image-quality gate, local clinical leadership."}, {"title": "TRL progression and milestones", "limit": null, "unit": null, "guide": [], "body": "Milestone | TRL | Month\nMVP with quality gate and offline mode | [FILL] → 5 | 3\nMulti-site validation complete (link to NRCT project) | 6 | 9\nISO 13485 quality system and IEC 62304 software lifecycle documentation started; risk management (ISO 14971) | 6 | 6–12\nThai FDA pre-submission consultation; classification as Software as a Medical Device | 6–7 | 9\nRegistration dossier submitted [CONFIRM the Thai FDA pathway for SaMD] | 7 | 15–18\nFirst paying customers (hospital / Health Region) | 7–8 | 18"}, {"title": "Regulatory plan", "limit": null, "unit": null, "guide": [], "body": "Thai FDA medical device regulation (Medical Device Act; SaMD classification [CONFIRM current Thai FDA guidance on AI/SaMD]); clinical evidence from the NRCT and HSRI studies; cybersecurity and PDPA compliance."}, {"title": "IP & licensing", "limit": null, "unit": null, "guide": [], "body": "[FILL: who owns the model, code and data; Mahidol–KPD licence terms; royalty sharing; patent/copyright filings]"}, {"title": "Business model & commercialisation", "limit": null, "unit": null, "guide": [], "body": "SaaS priced per screen or per facility per year [FILL]; government procurement route [FILL: e.g. listing in the Thai Innovation List (บัญชีนวัตกรรมไทย), which allows government purchase of Thai innovations; CONFIRM eligibility]; partnership with NHSO for financing."}, {"title": "Private partner contribution [FILL amounts]", "limit": null, "unit": null, "guide": [], "body": " | In-cash (THB) | In-kind (THB) | Description\nKPD |  |  | Engineering time, cloud infrastructure, software licences, regulatory consultant"}, {"title": "Budget (PMU + partner)", "limit": null, "unit": null, "guide": [], "body": "Category | PMU | KPD in-cash | KPD in-kind | Total\nWages (engineers, regulatory specialist, research assistants) |  |  |  |\nMaterials |  |  |  |\nOperating (validation, QMS, regulatory fees, travel) |  |  |  |\nEquipment |  |  |  |\nOverhead |  |  |  |"}, {"title": "Team", "limit": null, "unit": null, "guide": [], "body": "PI Dr. Narawitchz Wareekul (clinical); Ernest Choi (business); Amir Fleurizard (technology); [FILL: regulatory/QMS consultant; health economist; Mahidol tech-transfer office contact]"}]}]}, {"id": "thaihealth", "short": "ThaiHealth (สสส.)", "deadline": null, "window": "Open grant: confirm", "applicant": "Thai hospital, Mahidol or community organisation", "amount": "Varies", "portal": "thaihealth.or.th", "title": "ThaiHealth (สสส.) – Draft Proposal: Community Oral Cancer Risk Reduction and Volunteer Capacity Building in Health Region 10", "file": "09_ThaiHealth.md", "intro": ["Why ThaiHealth: ThaiHealth funds health promotion and prevention, not AI development. This proposal funds the volunteer training, community awareness and risk-factor reduction (betel quid, tobacco, alcohol) around the pilot. The app is a tool within that work.", "Applicant: a Thai organisation: hospital, Mahidol University, community organisation or foundation [CONFIRM eligible applicant types and the open-grant channel at thaihealth.or.th]", "Language: Thai"], "groups": [{"title": "", "note": [], "fields": [{"title": "ชื่อโครงการ", "limit": null, "unit": null, "guide": [], "body": "TH: โครงการพัฒนาศักยภาพ อสม. และชุมชนในการลดปัจจัยเสี่ยงและคัดกรองมะเร็งช่องปากด้วยเทคโนโลยีดิจิทัล เขตสุขภาพที่ 10\nEN: Building volunteer and community capacity to reduce risk factors and screen for oral cancer with digital tools, Health Region 10"}, {"title": "หลักการและเหตุผล (Rationale)", "limit": null, "unit": null, "guide": [], "body": "- Betel quid, tobacco and alcohol use in the northeast [FILL: local data]\n- Oral cancer is often found late; volunteers have about one day of training and paper forms\n- Opportunity: train volunteers to (1) give brief advice on quitting betel, tobacco and alcohol; (2) screen with a simple app; (3) follow up referrals"}, {"title": "วัตถุประสงค์ (Objectives)", "limit": null, "unit": null, "guide": [], "body": "1. Train 20 lead volunteer trainers and ~300 volunteers in oral cancer risk communication, brief cessation advice and app-based screening\n2. Screen [FILL: N] adults aged 40+ in [FILL: N] sub-districts, and refer and follow up all high-risk people\n3. Deliver community campaigns on betel quid, tobacco and alcohol in [FILL] villages\n4. Link people who want to quit to cessation services (e.g. the Thai national quitline 1600 [CONFIRM] and local clinics)"}, {"title": "กลุ่มเป้าหมายและพื้นที่ (Target group & area)", "limit": null, "unit": null, "guide": [], "body": "[FILL: provinces, districts, sub-districts; population aged 40+]"}, {"title": "กิจกรรม (Activities)", "limit": null, "unit": null, "guide": [], "body": "Activity | Month\nLead-trainer workshop; picture-based manual (Thai/local language) | 1–2\nCascade training of volunteers | 2–4\nCommunity campaigns (village broadcasts, posters, LINE OA, temple and market events) | 3–10\nScreening days + home visits | 4–10\nReferral follow-up and cessation linkage | 4–12\nCommunity feedback and evaluation | 11–12"}, {"title": "ตัวชี้วัด (Indicators)", "limit": null, "unit": null, "guide": [], "body": "Indicator | Target\nVolunteers trained | 300\nAdults screened | [FILL]\nHigh-risk people referred who attended | ≥ [FILL]%\nPeople given brief cessation advice | [FILL]\nPeople attempting to quit betel/tobacco/alcohol | [FILL]\nWomen in lead-trainer roles | ≥ [FILL]%"}, {"title": "ความยั่งยืน (Sustainability)", "limit": null, "unit": null, "guide": [], "body": "Embed training in the district volunteer programme; co-financing from the sub-district health fund (กองทุนหลักประกันสุขภาพระดับท้องถิ่น/ตำบล); Provincial Health Office support."}, {"title": "งบประมาณ (Budget) [FILL; use ThaiHealth categories]", "limit": null, "unit": null, "guide": [], "body": "Training costs; volunteer compensation; communication materials; screening-day logistics; referral transport support; monitoring and evaluation; administration."}, {"title": "Partners", "limit": null, "unit": null, "guide": [], "body": "Hospitals [FILL]; Provincial Health Offices; sub-district administrative organisations (อบต.); district volunteer clubs; Mahidol University; KPD (app and training game, provided in-kind)."}]}]}, {"id": "pandemic", "short": "Pandemic-preparedness call", "deadline": null, "window": "Which call is this for? Confirm the deadline", "applicant": "Mahidol University (PI from the region)", "amount": "AI4PEP's last call: up to CAD 362,500", "portal": "ai4pep.org/funding", "title": "Completed Draft – Your Existing Proposal Form (AI4PEP / IDRC-style call)", "file": "02_Your_Draft_Pandemic-Preparedness_Call.md", "intro": ["Which grant is this? The questions in your draft (pandemic and epidemic preparedness; gender; \"use and mobilization\"; IRB; \"Excellence of Research Team (500 words)\") match the format of the AI4PEP network (Global South AI for Pandemic & Epidemic Preparedness & Response, funded by Canada's IDRC and run from York University). AI4PEP's last open call (2023) required:", "- a recognised public university in Asia/Africa/LAC/MENA in the team, with the PI from the region (students cannot be PI). Dr. Wareekul / Mahidol University should be the PI and lead institution, not the company", "- AI as the \"entry point\" for early detection, warning and response to infectious diseases", "- a gender-sensitive approach (SDG 3 + SDG 5)", "", "Fit warning: oral cancer is not an infectious disease. The draft below frames the project honestly around continuity of essential care during outbreaks and strengthening the volunteer/digital infrastructure used in outbreak response. If the call strictly requires infectious-disease detection, this proposal will likely score low; consider adding a genuine infectious-disease module (see Q2 option B) or choosing another funder. Confirm the call name, eligibility and deadline: [FILL].", "", "Corrections made to your draft:", "1. The timeline said \"Pilot Launch Spring 2026\" and \"Analysis Summer 2026\", which are now in the past. The plan below is updated from Nov 2026 onward. [FILL] what actually happened.", "2. \"Sector 10\" → Health Region 10 (เขตสุขภาพที่ 10: Ubon Ratchathani, Sisaket, Yasothon, Amnat Charoen, Mukdahan). Use the official term.", "3. Your draft says \"three regional hospitals\"; earlier you mentioned four, including \"Huathahan\". I think this is Hua Taphan Hospital (โรงพยาบาลหัวตะพาน), Amnat Charoen, which is in Health Region 10. Confirm names and number.", "4. Unsupported claims to remove or back up with numbers: \"one of the most expansive proprietary oral cancer imaging datasets globally\"; \"high-performance model\"; \"Stage 1 – 96%, Stage 4 – 10%\" (cite a source or replace with a sourced survival figure).", "5. The question \"What are the potential opportunities to scale…\" appears twice in your copy of the form. Answer it once.", "6. Your Aim 1 bullet \"1 year annual outlook validation tool – number detected, full number comes out in 10 years…\" and the highlighted notes are internal notes. They are cleaned up below."], "groups": [{"title": "", "note": [], "fields": [{"title": "Title", "limit": null, "unit": null, "guide": [], "body": "Kon Pop Detection (KPD): AI-Enabled Oral Cancer Screening by Village Health Volunteers in Northeast Thailand, Building Resilient Community Screening for Health Emergencies"}, {"title": "Lay summary", "limit": null, "unit": null, "guide": [], "body": "*(Your existing lay summary is good. Keep it, but update the pilot dates.)*"}, {"title": "Research Problems and Justification", "limit": 1500, "unit": "words", "guide": ["[FILL: add 1–2 Thailand-specific statistics: oral cancer incidence and mortality in Thailand (GLOBOCAN 2022), and % late-stage at diagnosis from Thai sources.]"], "body": "a) General objective\nTo improve early detection of oral cancer and high-risk oral potentially malignant disorders (OPMDs) in underserved communities of northeast Thailand, by developing, validating and implementing a low-cost AI-assisted screening tool used by village health volunteers. The tool must keep working when health systems are under strain, such as during epidemics.\n\nb) Specific objectives\n1. Develop and validate an AI model (fine-tuned MedGemma with a YOLO lesion detector) that classifies intraoral smartphone images into low/high risk, with target sensitivity ≥ [FILL]% and specificity ≥ [FILL]% against specialist diagnosis and biopsy, including external validation at a hospital not used in training.\n2. Implement the tool with ~300 trained village health volunteers linked to [FILL: 3–4] hospitals in Health Region 10, and measure feasibility, usability, image quality, adoption and referral completion over 6 months.\n3. Quantify the economic and health-system impact (cost per screen, cost per high-risk case appropriately referred, unnecessary referrals avoided, time to diagnostic confirmation) compared with standard paper-based visual screening.\n4. Test resilience: document how decentralised, app-based screening and remote dentist triage can maintain oral cancer screening during disruptions (outbreaks, staff shortages), and produce a playbook for health authorities.\n5. Analyse gender and equity: examine differences in risk factors, screening uptake, model performance and volunteer workload by sex and age.\n\nProblem\nOral cancer causes about 177,000 deaths globally each year, and Asia carries roughly two-thirds of the global burden (Su et al. 2021; Warnakulasuriya & Filho 2025). In South and Southeast Asia, a large share of cases is attributable to smokeless tobacco and areca nut (betel quid) (Rumgay et al. 2024). Outcomes are driven less by a lack of treatment than by late presentation: early-stage disease is highly curable, while late-stage disease carries poor survival and roughly five-fold higher treatment costs (US$2,027 vs US$394 per patient per year in Malaysian public hospitals; Raman et al. 2021).\n\nIn Thailand, community screening for adults aged 40+ is delivered largely by village health volunteers (อสม.) using a paper risk-factor questionnaire and a visual mouth examination after about one day of training. Those with risk factors are referred to a doctor, dentist or dental nurse. This system has two failure modes (Walsh et al. 2021, Cochrane):\n1. Missed lesions: visual inspection accuracy varies widely with examiner training.\n2. Excess referrals: low-risk referrals overload scarce dentists and cost patients travel and lost wages, while high-risk patients may be lost to follow-up.\n\nPaper records are slow to reach hospitals and cannot be prioritised.\n\nWhy AI, why now\nSmartphones are now common among volunteers. Medical foundation models such as Google's MedGemma allow accurate image models to be built from smaller, locally collected datasets. Most published oral-image AI models were trained on hospital images and may not generalise to community conditions: variable lighting, low-cost phones, and diverse presentations. KPD trains and validates directly on images collected in the intended setting.\n\nJustification and preliminary work\n- Working volunteer app (digital risk survey, guided three-photo capture), dentist triage dashboard, fine-tuned model, training game, and picture-based training manual\n- Dataset: [FILL: number of images, how labelled]\n- Ethics approval: [FILL: committee, number]\n- Hospital agreements: [FILL]\n- Mini-pilot results: [FILL]\n- Team recognition: MIT Grand Hack 2025 [FILL: Google award name]; Harvard GAMI incubator\n\nSignificance\nIf successful, the project will provide (1) a validated, low-cost tool; (2) evidence on cost-effectiveness for Thai health authorities; (3) implementation standards (image acquisition, quality assurance, governance) for AI in community screening in low-resource settings; and (4) a model of resilient, decentralised screening that can continue during health emergencies."}, {"title": "How does your proposal connect to preparedness and response to emerging and re-emerging infectious diseases?", "limit": 1000, "unit": "words", "guide": [], "body": "Option A (recommended, honest framing): continuity of essential care and resilient community health infrastructure.\n\nDuring COVID-19, routine cancer screening fell sharply worldwide, and delayed diagnoses followed. Specialist services, hospital outpatient clinics and travel were all restricted, while Thailand's village health volunteers became the backbone of community outbreak response: house-to-house screening, contact follow-up and home monitoring. Any future epidemic will put the same pressure on oral cancer screening, which depends on in-person visits to scarce dentists.\n\nKPD strengthens preparedness in three ways:\n\n1. Maintaining NCD screening during outbreaks. Volunteers can screen in the community and send images to dentists for remote triage, without patients travelling to hospital. Only high-risk patients need a hospital visit. This keeps an essential cancer-prevention service running with fewer contacts and less crowding in facilities during an epidemic.\n2. Strengthening the volunteer digital backbone used in outbreak response. The project trains ~300 volunteers in structured digital data collection, image capture, data protection and referral workflows. It also builds the supporting infrastructure: devices, secure data pipelines, dashboards, and supervision links between volunteers and hospitals. The same capabilities are used in outbreak response, such as symptom reporting and follow-up of cases or contacts. The KPD platform is modular: the data-collection and triage workflow can carry additional forms or screening modules when health authorities need them.\n3. Reducing system load. By lowering unnecessary referrals, KPD frees specialist and outpatient capacity, which is critical when health systems are stretched by an outbreak.\n\nResearch question added for this call: *Can AI-assisted community screening with remote triage maintain oral cancer screening coverage and referral completion under simulated or real service disruption?* We will document service continuity: the share of screens completed and triaged remotely, and the time to triage. With Health Region 10 and Provincial Health Office partners, we will co-develop a continuity-of-screening playbook for use during outbreaks.\n\nAlignment with national and sub-national plans: [FILL: cite Thailand's national NCD/cancer control plan, MOPH digital health strategy, Health Region 10 service plan, and the national emergency preparedness framework, if you can name the actual documents.]\n\nOption B (only if the call requires an infectious-disease AI use-case): add a work package with an infectious-disease partner, e.g. using the volunteer app to capture images of oral lesions linked to infections (oral candidiasis as an HIV marker, hand-foot-and-mouth disease, mpox oral lesions) for early-warning reporting to district health officers. This needs an infectious-disease co-investigator and ethics amendment. Do not claim it unless you will do it."}, {"title": "Engagement with national and sub-national governing institutions", "limit": null, "unit": null, "guide": ["Describe actual engagement (meetings, letters, MOUs) separately from planned engagement."], "body": "Done so far: [FILL: e.g. approval from the directors of [hospitals]; meetings with the Health Region 10 office / Provincial Health Office of Amnat Charoen / Ubon Ratchathani; Mahidol University ethics committee; district health offices supervising volunteers]\n\nPlanned:\n- Health Region 10 office and Provincial Health Offices: steering committee membership; quarterly results reviews; co-design of referral pathways\n- Ministry of Public Health, Department of Health (Bureau of Dental Health) [FILL: confirm unit]: alignment with the national oral cancer screening programme and volunteer training curricula\n- National Health Security Office (NHSO): cost-effectiveness evidence for possible inclusion of AI-assisted screening in preventive benefits\n- Thai Food and Drug Administration: early consultation on regulatory classification of the AI as Software as a Medical Device\n- National Cancer Institute of Thailand: data alignment with the cancer registry and national cancer control planning"}, {"title": "How will you manage use and mobilization of the research?", "limit": 1000, "unit": "words", "guide": [], "body": "Our strategy is to involve the people who will use the results from the start, and to produce outputs in forms they can act on.\n\n1. Co-production with knowledge users. A project steering group includes Health Region 10 and provincial health office representatives, hospital dentists, volunteer leaders and the Mahidol team. It meets quarterly to review results and decide on changes.\n2. Tailored products for each audience:\n   - Health authorities: policy briefs (Thai and English) on cost per screen, cost per high-risk case referred, and referral efficiency; the continuity-of-screening playbook\n   - Hospitals: implementation guide covering staffing, workflow, and the dashboard triage protocol\n   - Volunteers: picture-based training manual, training game, and refresher videos in Thai and local languages [FILL: e.g. Isan/Lao, Khmer, Kui, if relevant]\n   - Researchers: open-access papers (validation per STARD and TRIPOD+AI; implementation outcomes), and a model card describing performance and limits\n   - Communities: feedback sessions in pilot villages about results and oral cancer risk factors\n3. Training of trainers: 20 lead volunteers become certified trainers, so capacity stays in the community.\n4. Open standards: we will publish our image-acquisition protocol and quality-assurance metrics so other programmes can adopt them.\n5. Events: a regional dissemination workshop with Regions 7, 9 and 10 at month [FILL]; presentations to MOPH.\n6. Monitoring use: we track uptake indicators such as hospitals adopting the protocol, volunteers trained beyond the project, and policy references.\n\nExample: if the pilot shows that AI triage cuts unnecessary referrals by [FILL target]% with no loss of sensitivity, we will bring a costed proposal to the Health Region 10 service-plan committee for expansion to Regions 7 and 9."}, {"title": "Who are the end users? Did they participate in design, and how will they be engaged?", "limit": null, "unit": null, "guide": [], "body": "End users:\n1. Village health volunteers, who screen\n2. Dentists, dental nurses and doctors at district/provincial hospitals, who triage and diagnose\n3. Programme managers at the Provincial Health Office and Health Region office\n4. Ultimately, adults aged 40+ at risk of oral cancer\n\nParticipation in design so far: [FILL: e.g. number of volunteers and dentists consulted; how]. Concrete design changes that came from users: the picture-based manual (language and literacy needs) and the cascade training model (20 lead trainers) [FILL: others].\n\nDuring the project: usability testing rounds (months [FILL]); structured surveys and focus groups with volunteers and dentists; volunteer representatives on the steering group; patient feedback on acceptability.\n\nAfter the project: volunteer trainers and hospital dentists will lead roll-out in new districts."}, {"title": "What are the potential opportunities to scale the research innovations, or potential for uptake and policy adoption?", "limit": 1000, "unit": "words", "guide": [], "body": "- Within Thailand: Thailand already runs community oral cancer screening through more than a million village health volunteers nationwide. KPD upgrades an existing national programme rather than creating a new one, which lowers the barrier to adoption. The scale-up path runs from Health Region 10 → Regions 7 and 9 → the national programme, through MOPH and NHSO.\n- Regionally: high-burden countries in South and Southeast Asia, including Cambodia, Laos, Myanmar, India, Bangladesh, Sri Lanka and Malaysia, have similar risk factors and community health worker systems.\n- Policy adoption: cost-effectiveness evidence (Objective 3) is what decision-makers need. We will present it in the formats used for Thai health-technology decisions [FILL: e.g. HITAP-style economic evaluation].\n- Business sustainability: KPD is structured as a social-impact company. After the pilot, hospitals and health authorities can contract for the software, and volunteer training is embedded in existing structures.\n- Platform effect: the same volunteer-to-dashboard workflow can support other screening programmes."}, {"title": "How does your proposal work, why, for whom, to what extent, and in what contexts? What technical, social and institutional factors must be addressed to scale?", "limit": null, "unit": null, "guide": [], "body": "We will use a realist evaluation lens, asking what works, for whom, and in what circumstances.\n- Technical: model robustness across phone models, lighting and skin and mucosal tones; connectivity; device supply and maintenance; data security. *Design response:* external validation by site and device; image-quality checks; offline mode; performance monitoring after deployment.\n- Social: volunteer workload, confidence and literacy; patient trust in AI and willingness to travel for referral; stigma; gender roles (see gender section). *Design response:* picture-based training; peer trainers; community feedback sessions; tracking referral completion and the reasons for non-attendance.\n- Institutional: dentist capacity to review cases; integration with hospital information systems; financing (who pays); regulation. *Design response:* steering group with health authorities; dashboard designed around dentists' existing triage; NHSO and Thai FDA engagement; cost-effectiveness analysis.\n\nWe will compare implementation outcomes across hospitals and districts with different resources to identify the conditions needed for success at scale."}, {"title": "How will your project address and integrate gender considerations?", "limit": 1000, "unit": "words", "guide": [], "body": "Gender shapes who is at risk, who screens and who benefits.\n\n1. Risk factors differ by sex. In rural Thailand, betel quid chewing is concentrated among older women, while smoking and heavy drinking are more common among men. Our recruitment, risk survey and analyses will be sex- and age-disaggregated, and outreach messages will be tailored, e.g. betel-cessation messages for older women and tobacco and alcohol messages for men.\n2. Most village health volunteers are women. The project relies on their unpaid or low-paid labour. We will measure the added time burden per screen, provide fair compensation for training days and travel [FILL: amount], and create recognised roles: certified lead trainers, with leadership opportunities for women volunteers.\n3. Access barriers. Women may face caregiving duties and men may face work-related constraints that prevent attending referrals. We will record reasons for non-attendance by sex and test solutions such as flexible appointment times and transport support.\n4. Algorithmic fairness. We will report model sensitivity and specificity separately for women and men and by age group. If performance differs, we will collect more data and recalibrate.\n5. Privacy and dignity. Intraoral photos can be sensitive. Participants can choose a same-sex volunteer where feasible; photos are cropped to the mouth; consent is explained in plain Thai.\n6. Team. [FILL: gender composition of the team and leadership; plan to include women researchers and volunteer leaders in decision-making.]\n\nIndicators: screening uptake by sex; referral completion by sex; volunteer time burden; model performance by sex; % women in trainer and leadership roles."}, {"title": "Ethical challenges and review", "limit": 1000, "unit": "words", "guide": [], "body": "Ethical oversight: approved by [FILL: name of ethics committee, e.g. Mahidol University Faculty of Dentistry / Faculty of Medicine IRB, approval number and date]; site approvals at [FILL: each hospital]. Any amendments will be submitted before changes are made. [FILL: up to 5 links]\n\nKey challenges and how we manage them:\n1. Informed consent: written consent in Thai (verbal and witnessed for participants who cannot read), covering screening, photographs, and use of de-identified images to improve the AI. Participants can refuse image storage and still be screened.\n2. Identifiable images: photos are framed on the oral cavity, with no full face. Metadata are stripped; images are linked to a coded ID; the key is held separately by the hospital.\n3. Data protection (Thailand PDPA 2019): health data are \"sensitive personal data\". We define the data controller ([FILL: hospital/Mahidol]) and processor (KPD); data are encrypted in transit and at rest and stored in [FILL: location/cloud region]; access is role-based; there is a data-sharing agreement among partners; a data protection officer is named [FILL].\n4. AI is decision support, not diagnosis: volunteers refer per protocol, dentists make clinical decisions, and biopsy confirms. No patient is denied referral because of a low AI score if the volunteer or dentist is concerned.\n5. Duty of care: every high-risk result is referred and tracked; we follow up patients who do not attend. Incidental findings are referred.\n6. Bias and fairness: subgroup performance monitoring (see gender section).\n7. Data ownership and benefit-sharing: Thai partner institutions retain ownership of patient data. KPD licences the use of de-identified data for model development under the data-sharing agreement [FILL: confirm terms], and partners share in publications.\n8. Conflict of interest: KPD is a company. Team members disclose financial interests, and independent hospital dentists and Mahidol co-investigators conduct the validation analyses.\n9. Regulation: consultation with the Thai FDA before clinical use outside the research protocol."}, {"title": "Project Management and Collaboration", "limit": 1000, "unit": "words", "guide": [], "body": "Structure:\n- Principal Investigator / lead institution: Dr. Narawitchz Wareekul, Mahidol University [FILL: faculty, title]. Responsible for scientific direction, ethics and clinical validation.\n- Technology partner: Kon Pop Detection (CEO Ernest Choi; CTO Amir Fleurizard). Responsible for the app, AI model, dashboard, data infrastructure and technical support.\n- Implementation partners: [FILL: hospital names] in Health Region 10. They provide site leads, dentist reviewers, volunteer supervision and referral management.\n- Academic collaborators: Harvard GAMI [FILL: role], MIT [FILL: role], University of Michigan [FILL: role, e.g. biostatistics, health economics].\n- Steering group: PI, KPD, a hospital site lead from each hospital, a Health Region 10 / Provincial Health Office representative, and a volunteer representative. Meets quarterly.\n- Day-to-day: project coordinator [FILL]; monthly team meetings; shared task tracker; risk register.\n\nHistory of collaboration: [FILL: e.g. \"The team formed at MIT Grand Hack 2025; Dr. Wareekul has worked with [hospitals] on community screening since [year]; mini-pilots in [month/year].\"]\n\nShared ownership: joint authorship policy agreed at the start; Thai institutions own patient data; results are presented jointly to health authorities; IP arrangements are set out in a collaboration agreement [FILL].\n\nRisk management:\nRisk | Mitigation\nToo few cancer/high-risk cases for validation | Enrich with archived hospital images; extend recruitment; add sites\nPoor image quality in the field | In-app quality checks; refresher training; lead-trainer supervision\nVolunteer drop-out | Compensation; recognition; peer support\nLow referral completion | Patient tracking; reminders through volunteers; transport support\nModel performs worse at new sites | External validation; site recalibration; continuous monitoring\nRegulatory delay | Early Thai FDA consultation; research-use framing during the pilot"}, {"title": "Relevant Experience and Related Work", "limit": 1000, "unit": "words", "guide": [], "body": "- Dr. Narawitchz Wareekul: [FILL: clinical experience; community screening experience; publications. Your draft says \"[CV of Dentist]\"; insert a summary here.]\n- Ernest Choi: Harvard graduate student [FILL: programme]; three-time founder [FILL: companies, outcomes].\n- Amir Fleurizard: M.Sc., UNC Charlotte; full-stack engineer [FILL: relevant AI/health software experience].\n- KPD work to date: MIT Grand Hack 2025 [FILL: Google award]; Harvard GAMI incubator; app, dashboard, model and training game built; ethics approval; mini-pilots.\n\nRelated work by others (keep, from your draft): community-based oral screening programmes identify OPMDs and early cancers, but their effectiveness is limited by examiner variability, specialist shortages and weak referral systems. Computer-vision models for oral lesions have shown promise but are mostly developed in high-resource settings and may not generalise to low-income screening contexts. KPD addresses this gap by training and validating in the intended deployment setting.\n\nLinks (up to 5): [FILL: website; Grand Hack/Google award page; any preprint or poster; GAMI profile; Mahidol profile]"}, {"title": "Excellence of Research Team", "limit": 500, "unit": "words", "guide": ["Gaps reviewers will notice; fill them with named people: an oral pathologist (biopsy reference standard), a biostatistician/epidemiologist, a health economist (Aim 3), and a gender/social scientist (required by this call). Add them as co-investigators."], "body": "Our team combines clinical, technical and entrepreneurial expertise with deep links to the communities we serve.\n\n- Clinical leadership: Dr. Narawitchz Wareekul (Mahidol University) brings dental expertise and first-hand experience of community oral screening with volunteers in Thailand. He leads clinical protocol design, labelling standards and validation.\n- Technology: Amir Fleurizard (CTO) designs and builds the app, dashboard and AI pipeline, with experience in full-stack and machine-learning deployment.\n- Implementation and strategy: Ernest Choi (CEO), a Harvard graduate student and three-time founder, leads partnerships, operations and the path to sustainability.\n- Partners: hospital dentists and site leads in Health Region 10 [FILL]; academic collaborators at Harvard GAMI, MIT and the University of Michigan [FILL: named people and expertise, e.g. biostatistics, health economics, implementation science].\n\nInterdisciplinarity: clinical dentistry, pathology, AI engineering, public health, health economics and social science, working with volunteers and health authorities as knowledge users.\n\nInclusivity plan: women in leadership roles among investigators and volunteer trainers [FILL: numbers]; Thai-based team members lead community work; training opportunities for Thai students and early-career researchers [FILL: e.g. 2 graduate students]; materials in local languages."}, {"title": "Timeline and deliverables", "limit": null, "unit": null, "guide": ["Updated from your draft, which had dates in the past. Adjust to the call's start date."], "body": "Period | Activities | Deliverables\nMonths 1–3 | Ethics amendments; data-sharing agreement; recruit staff; finalise MVP (image-quality checks, offline mode); training manual | Signed agreements; MVP v1.0; Thai training manual\nMonths 2–4 | Train 20 lead trainers → 300 volunteers | Training completion report; baseline survey\nMonths 4–9 | 6-month pilot in Health Region 10 [FILL: districts]; continuous data collection; usability surveys | Monthly dashboards; interim report\nMonths 6–12 | Model refinement; external validation at hold-out hospital; biopsy follow-up | Validation report (STARD/TRIPOD+AI)\nMonths 9–14 | Economic evaluation; gender analysis; continuity-of-screening playbook | Cost-effectiveness report; policy brief; playbook\nMonths 12–18 | Dissemination workshop (Regions 7, 9, 10); scale-up plan; papers | Workshop report; 2 manuscripts; scale-up proposal to MOPH"}, {"title": "Budget", "limit": null, "unit": null, "guide": [], "body": "[FILL: use the call's budget template. AI4PEP's last call allowed ~CAD 362,500 per team over 3 years incl. 13% indirect costs. Confirm the current call's limits.]"}]}]}, {"id": "concept", "short": "Concept note", "deadline": null, "window": "Use for first contact with any funder", "applicant": "Kon Pop Detection", "amount": "—", "portal": "—", "title": "2-Page Concept Note (reusable) – Kon Pop Detection", "file": "12_Concept_Note_for_Other_Funders.md", "intro": ["Use for first contact with funders that ask for a short concept or letter of inquiry: Google.org, Gates Foundation (only if a call includes AI/NCDs), Rotary (global grant via clubs), Temasek Foundation, Wellcome (eligibility enquiry), IARC (collaboration), UICC, TCELS, depa, NIA, e-ASIA partners, JST NEXUS / AMED partners, Cancer Grand Challenges teams.", "Edit the \"Ask\" section for each funder."], "groups": [{"title": "Kon Pop Detection: AI-assisted oral cancer screening for underserved communities", "note": ["Organisation: Kon Pop Detection [FILL: legal name, country], with Mahidol University and [FILL: hospital names], Health Region 10, Thailand", "Contact: Ernest Choi, CEO [FILL: email] · Dr. Narawitchz Wareekul, CMO [FILL: email]"], "fields": [{"title": "The problem", "limit": null, "unit": null, "guide": [], "body": "Oral cancer kills about 177,000 people a year, mostly in South and Southeast Asia, where betel quid, tobacco and alcohol are common. It is usually curable when found early, but most patients are diagnosed late, when treatment costs about five times more and survival is poor. In Thailand, community screening relies on village health volunteers with about one day of training and a paper form; dentists are scarce and referrals are slow and unsorted."}, {"title": "Our solution", "limit": null, "unit": null, "guide": [], "body": "A smartphone app and dentist dashboard. Volunteers record risk factors and take three mouth photos; AI (Google MedGemma fine-tuned + YOLO lesion detection) checks image quality, marks suspicious areas and scores risk; dentists see high-risk patients first. Low-cost, works with patchy connectivity, and backed by picture-based training and a training game."}, {"title": "Progress", "limit": null, "unit": null, "guide": [], "body": "- MIT Grand Hack 2025 [FILL: Google award]; Harvard GAMI incubator; collaborators at MIT and the University of Michigan\n- Working app, dashboard and model; ethics approval [FILL]; hospital agreements [FILL]\n- Pilot in Health Region 10: ~300 volunteers [FILL: status and numbers]\n- Validation to date: [FILL: metrics]"}, {"title": "Plan (next 18 months)", "limit": null, "unit": null, "guide": [], "body": "1. Validate accuracy against dentist examination and biopsy at multiple hospitals\n2. Complete the Health Region 10 pilot; measure referral accuracy, time to diagnosis, usability and costs\n3. Expand to Health Regions 7 and 9; engage the MOPH and NHSO on adoption\n4. Thai FDA pathway for Software as a Medical Device"}, {"title": "Impact", "limit": null, "unit": null, "guide": [], "body": "More early-stage diagnoses; fewer unnecessary trips for patients; better use of scarce dentists; a model for AI-assisted primary-care screening that can transfer to other high-burden countries."}, {"title": "The ask [edit per funder]", "limit": null, "unit": null, "guide": [], "body": "- Funding: US$[FILL] for [FILL: e.g. volunteer training and devices / validation study / regulatory work]\n- Non-financial: [FILL: e.g. technical mentorship (Google), methodological collaboration (IARC), club partnership (Rotary), introductions to health ministries]"}, {"title": "Team", "limit": null, "unit": null, "guide": [], "body": "Ernest Choi (CEO; Harvard graduate student; three-time founder) · Dr. Narawitchz Wareekul (CMO; dentist, Mahidol University) · Amir Fleurizard (CTO; M.Sc., UNC Charlotte)"}, {"title": "Funder-specific notes", "limit": null, "unit": null, "guide": [], "body": "Funder | How to approach | Key point to stress\nGoogle.org / Google Health | Through the Grand Hack award contacts and HAI-DEF/MedGemma developer channels | You are a MedGemma use-case in a low-resource setting\nRotary Foundation Global Grant | A Thai Rotary club in the project area + an international club (e.g. Cambridge, MA) apply together | Disease prevention & treatment area of focus; community screening equipment and training are fundable\nTemasek Foundation | Partner-referred; regional health capacity | Volunteer training and capacity building\nIARC | Email a named scientist in early detection/screening | Data from a high-burden setting; validation site\nUICC | Fellowship for Dr. Wareekul or a team member | Training visit to an oral-cancer screening centre\nTCELS / depa / NIA (Thailand) | Usually require a Thai-registered company | Consider a Thai subsidiary [CONFIRM]\nCancer Grand Challenges | Only if a challenge on early detection or LMIC screening is set; needs a large multi-institution team | Long shot; join a team rather than lead"}]}]}], "facts": [{"key": "legalName", "label": "Legal company name", "hint": "e.g. Kon Pop Detection, Inc."}, {"key": "incorporation", "label": "Where and when KPD is incorporated", "hint": "Country/state and date"}, {"key": "ownership", "label": "Ownership", "h hone and upload later"}, {"key": "pricing", "label": "Pricing idea", "hint": "e.g. per screen / per facility per year"}, {"key": "thaiStats", "label": "Thailand / Region 10 statistics", "hint": "Incidence, mortality, % late-stage, with sources"}, {"key": "dentists", "label": "Dentists per population in Region 10", "hint": "With source"}]}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const G = DATA.grants, FACTS = DATA.facts;
const FIELDS = {};
G.forEach(g => { let n = 0; g.groups.forEach(gr => gr.fields.forEach(f => { f.key = g.id + "__f" + (n++); FIELDS[f.key] = {g, f}; })); });
const CHIP = {credits:"Now", pandemic:"Confirm", hsri:"Feb–Apr", nrct:"Nov–Apr", pmuc:"Annual", thaihealth:"Open", concept:"Any time"};
const LS = "kpd-grant-desk-v1";
let answers = {}, facts = {}, view = "solve", DL = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const textOf = k => answers[k] ?? FIELDS[k].f.body;
const BL = /\[FILL[^\]]*\]/g, CF = /\[CONFIRM[^\]]*\]/g;
function blanks(t){ return [...t.matchAll(BL)].map(m => ({s:m[0], i:m.index, hint:(m[0].replace(/^\[FILL:?\s*/,"").replace(/\]$/,"").trim() || "Fill in")})); }
function count(t, unit){ return unit === "chars" ? t.length : (t.trim() ? t.trim().split(/\s+/).length : 0); }
function stateOf(k){
  const {f} = FIELDS[k], t = textOf(k), b = blanks(t).length;
  const n = f.limit ? count(t, f.unit) : null, over = !!(f.limit && n > f.limit);
  return {t, b, n, over, ready: !b && !over};
}
function progress(g){
  let total = 0, ready = 0, bl = 0, cf = 0;
  g.groups.forEach(gr => gr.fields.forEach(f => { const s = stateOf(f.key); total++; if(s.ready) ready++; bl += s.b; cf += (s.t.match(CF) || []).length; }));
  return {total, ready, bl, cf};
}
function inline(s){ return esc(s).replace(/\[FILL[^\]]*\]/g, m => "<mark class='fill'>"+m+"</mark>").replace(/\[CONFIRM[^\]]*\]/g, m => "<mark class='confirm'>"+m+"</mark>"); }
function mdLite(lines){
  let html = "", list = null;
  const flush = () => { if(list){ html += "<ul>"+list.join("")+"</ul>"; list = null; } };
  lines.forEach(l => {
    const t = l.trim(); if(!t){ flush(); return; }
    const m = t.match(/^(?:[-*]|\d+\.|☐)\s+(.*)$/);
    if(m) (list = list || []).push("<li>"+inline(m[1])+"</li>"); else { flush(); html += "<p>"+inline(t)+"</p>"; }
  });
  flush(); return html;
}
function daysLeft(iso){ return Math.ceil((new Date(iso) - new Date()) / 864e5); }
function fmtWhen(iso){
  const d = new Date(iso);
  return {
    et: d.toLocaleString("en-US", {timeZone:"America/New_York", weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) + " ET",
    th: d.toLocaleString("en-GB", {timeZone:"Asia/Bangkok", weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) + " Thailand"
  };
}
function chipFor(g){
  if(g.deadline){
    const d = daysLeft(g.deadline);
    if(d < 0) return "<span class='chip'>Closed</span>";
    return "<span class='chip "+(d <= 21 ? "hot" : "lav")+"'>"+(g.estimated ? "~" : "")+d+" days</span>";
  }
  return "<span class='chip'>"+esc(CHIP[g.id] || "")+"</span>";
}
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1800); }
function grow(el){ el.style.height = "auto"; el.style.height = (el.scrollHeight + 2) + "px"; }

/* ---------- storage: shared db for the team, browser storage as fallback ---------- */
function localLoad(){ try{ const o = JSON.parse(localStorage.getItem(LS) || "{}"); answers = o.answers || {}; facts = o.facts || {}; if(o.view) view = o.view; }catch(e){} }
function localSave(){ try{ localStorage.setItem(LS, JSON.stringify({answers, facts, view})); }catch(e){} }
function setStatus(s){
  const m = {db:["db","Saved for everyone with access to this page"], saving:["db","Saving…"], local:["local","Saved in this browser only"],
             readonly:["warn","View only. Ask the owner for edit access."], error:["warn","Couldn't save to the shared page. Kept in this browser."]};
  const [k, t] = m[s] || m.local; $("status").dataset.s = k; $("statusText").textContent = t;
}
const Store = {
  mode:"local", db:null, timers:{}, chains:{}, readonly:false,
  save(kind, id){
    localSave();
    if(this.mode !== "db"){ setStatus("local"); return; }
    if(this.readonly){ setStatus("readonly"); return; }
    setStatus("saving");
    const k = kind+"/"+id; clearTimeout(this.timers[k]);
    this.timers[k] = setTimeout(() => { delete this.timers[k]; this.flush(kind, id); }, 900);
  },
  flush(kind, id){
    const k = kind+"/"+id, ref = this.db.doc(kind+"/"+id);
    const val = kind === "answers" ? answers[id] : facts[id];
    const op = val === undefined ? () => ref.delete() : () => ref.set(kind === "answers" ? {text:val} : {value:val});
    this.chains[k] = (this.chains[k] || Promise.resolve()).then(op)
      .then(() => { if(!Object.keys(this.timers).length) setStatus("db"); })
      .catch(e => { if(e && e.code === "invalid_argument"){ this.readonly = true; setStatus("readonly"); } else setStatus("error"); });
  }
};
function subscribe(kind, target){
  let first = true;
  Store.db.collection(kind).onSnapshot(snap => {
    if(first){
      first = false;
      if(snap.empty && Object.keys(target).length){ Object.keys(target).forEach(id => Store.flush(kind, id)); return; }
    }
    const changed = [];
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id;
      const focused = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.id === id;
      if(Store.timers[kind+"/"+id] || focused) return;
      if(ch.type === "removed") delete target[id];
      else { const d = ch.doc.data() || {}; const v = kind === "answers" ? d.text : d.value; if(typeof v === "string") target[id] = v; }
      changed.push(id);
    });
    if(changed.length){ localSave(); onRemote(kind, changed); }
  }, () => setStatus("error"));
}
function onRemote(kind, ids){
  renderRail();
  if(kind === "facts"){ if(view === "facts") ids.forEach(id => { const el = document.querySelector("[data-fact='"+id+"']"); if(el && document.activeElement !== el){ el.value = facts[id] || ""; grow(el); el.closest(".fact").classList.toggle("filled", !!(facts[id]||"").trim()); } }); return; }
  ids.forEach(id => { if(FIELDS[id] && FIELDS[id].g.id === view) updateField(id, true); });
  if(view !== "facts" && view !== "") updateHeader();
}
async function init(){
  localLoad(); renderRail(); render();
  if(!(window.claude && typeof window.claude.use === "function")){ setStatus("local"); return; }
  try{
    const [db, dl] = await Promise.all([claude.use("db"), claude.use("downloads")]);
    if(dl){ DL = dl; document.body.classList.add("can-dl"); }
    if(!db){ setStatus("local"); return; }
    Store.db = db; Store.mode = "db"; setStatus("db");
    subscribe("answers", answers); subscribe("facts", facts);
  }catch(e){ setStatus("local"); }
}

/* ---------- rail ---------- */
function renderRail(){
  const filled = FACTS.filter(f => (facts[f.key]||"").trim()).length;
  let h = "<button class='ri' data-view='facts' aria-current='"+(view==="facts")+"'><span class='ri-top'><span class='ri-name'>Facts used everywhere</span><span class='chip lav num'>"+filled+"/"+FACTS.length+"</span></span><span class='meter'><i style='width:"+(filled/FACTS.length*100)+"%'></i></span></button>";
  h += "<div class='rail-head caps'>Applications · by deadline</div>";
  G.forEach(g => { const p = progress(g);
    h += "<button class='ri' data-view='"+g.id+"' aria-current='"+(view===g.id)+"'><span class='ri-top'><span class='ri-name'>"+esc(g.short)+"</span>"+chipFor(g)+"</span><span class='meter'><i style='width:"+(p.ready/p.total*100)+"%'></i></span><span class='small muted num'>"+p.ready+" of "+p.total+" ready · "+p.bl+" blanks</span></button>"; });
  $("rail").innerHTML = h;
  $("pickSel").innerHTML = "<option value='facts'>Facts used everywhere ("+filled+"/"+FACTS.length+")</option>" + G.map(g => { const p = progress(g); return "<option value='"+g.id+"'>"+esc(g.short)+" · "+p.ready+"/"+p.total+" ready</option>"; }).join("");
  $("pickSel").value = view;
}
$("rail").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if(b) go(b.dataset.view); });
$("pickSel").addEventListener("change", e => go(e.target.value));
function go(v){ view = v; localSave(); renderRail(); render(); window.scrollTo({top:0}); }

/* ---------- main views ---------- */
function render(){
  if(view === "facts") return renderFacts();
  const g = G.find(x => x.id === view) || G[0]; view = g.id;
  const p = progress(g);
  let when;
  if(g.deadline){
    const w = fmtWhen(g.deadline), d = daysLeft(g.deadline);
    when = "<div class='due'><span class='when'>Due "+esc(w.et)+(g.estimated ? " <span class='chip warn'>estimated: confirm</span>" : "")+"</span><span class='tz'>"+esc(w.th)+"</span>"+(d >= 0 ? "<span class='chip "+(d<=21?"hot":"lav")+" num'>"+d+" days left</span>" : "<span class='chip'>Deadline passed</span>")+"</div>";
  } else when = "<div class='due'><span class='when'>"+esc(g.window || "")+"</span></div>";
  let h = "<div class='ghead'><div class='eyebrow caps'>Applicant · "+esc(g.applicant)+"</div><h1>"+esc(g.short)+"</h1><p class='full'>"+esc(g.title)+"</p>"+when
    + "<div class='facts-row'><div><span>Amount</span><span>"+esc(g.amount)+"</span></div><div><span>Where to submit</span><span>"+esc(g.portal)+"</span></div><div><span>Draft file</span><span>applications/"+esc(g.file)+"</span></div></div>"
    + "<div class='prog' id='gprog'></div>"
    + "<div class='actions'><button class='btn primary' data-act='copyall'>Copy whole application</button><button class='btn dl' data-act='download'>Download as .txt</button><button class='btn quiet' data-act='nextblank'>Jump to next blank</button></div></div>";
  if(g.intro.length) h += "<details class='read'><summary>Read first: rules and notes for this application</summary><div class='notes'>"+mdLite(g.intro)+"</div></details>";
  g.groups.forEach(gr => {
    h += "<div class='group'>" + (gr.title ? "<h2>"+esc(gr.title)+"</h2>" : "") + (gr.note.length ? "<div class='notes'>"+mdLite(gr.note)+"</div>" : "");
    gr.fields.forEach(f => { h += fieldHTML(f); });
    h += "</div>";
  });
  $("main").innerHTML = h;
  $("main").querySelectorAll("textarea[data-id]").forEach(grow);
  updateHeader();
}
function fieldHTML(f){
  const s = stateOf(f.key);
  return "<section class='field"+(s.ready?" is-ready":"")+"' id='fld-"+f.key+"'>"
    + "<div class='fhead'><h3>"+esc(f.title)+"</h3><div class='fmeta' id='meta-"+f.key+"'>"+metaHTML(f, s)+"</div></div>"
    + (f.guide.length ? "<div class='guide'>"+mdLite(f.guide)+"</div>" : "")
    + "<div id='bl-"+f.key+"'>"+blanksHTML(f.key, s.t)+"</div>"
    + "<div class='answer'><label for='ta-"+f.key+"'>Answer · edit freely and rewrite in your own words</label><textarea id='ta-"+f.key+"' data-id='"+f.key+"' spellcheck='true'>"+esc(s.t)+"</textarea></div>"
    + "<div class='actions'><button class='btn' data-act='copy' data-k='"+f.key+"'>Copy answer</button><button class='btn quiet' data-act='reset' data-k='"+f.key+"'>Reset to original draft</button></div>"
    + "</section>";
}
function metaHTML(f, s){
  const c = f.limit ? "<span class='counter"+(s.over?" over":"")+"'>"+s.n+" / "+f.limit+" "+f.unit+"</span>" : "";
  const st = s.b ? "<span class='chip hot'>"+s.b+(s.b===1?" blank":" blanks")+"</span>" : s.over ? "<span class='chip hot'>Over limit</span>" : "<span class='chip good'>Ready</span>";
  return c + st;
}
function blanksHTML(k, t){
  const b = blanks(t); if(!b.length) return "";
  const opts = FACTS.filter(f => (facts[f.key]||"").trim());
  const sel = opts.length ? "<select data-factpick aria-label='Use a saved fact'><option value=''>Use a fact…</option>"+opts.map(f => "<option value='"+f.key+"'>"+esc(f.label)+"</option>").join("")+"</select>" : "";
  return "<div class='blanks'><div class='blanks-h'>Fill "+(b.length===1?"this blank":"these "+b.length+" blanks")+". Each one is placed straight into the answer below.</div>"
    + b.map((x,i) => "<div class='blank' data-k='"+k+"' data-i='"+i+"'><span class='hint'>"+esc(x.hint)+"</span><span class='ctl'><input type='text' aria-label='"+esc(x.hint)+"' id='in-"+k+"-"+i+"'>"+sel+"</span><button class='btn' data-act='fill'>Fill</button></div>").join("")
    + "</div>";
}
function updateField(k, fromRemote){
  const {f} = FIELDS[k], s = stateOf(k);
  const ta = $("ta-"+k); if(!ta) return;
  if(fromRemote || document.activeElement !== ta){ if(ta.value !== s.t){ ta.value = s.t; } grow(ta); }
  $("meta-"+k).innerHTML = metaHTML(f, s);
  $("bl-"+k).innerHTML = blanksHTML(k, s.t);
  $("fld-"+k).classList.toggle("is-ready", s.ready);
}
function updateHeader(){
  const g = G.find(x => x.id === view); if(!g) return;
  const p = progress(g), el = $("gprog"); if(!el) return;
  el.innerHTML = "<span class='big num'>"+p.ready+"/"+p.total+"</span><span class='muted'>answers ready</span><span class='meter'><i style='width:"+(p.ready/p.total*100)+"%'></i></span>"
    + "<span class='chip "+(p.bl?"hot":"good")+" num'>"+p.bl+" blanks left</span>"+(p.cf ? "<span class='chip warn num'>"+p.cf+" to confirm in the official call</span>" : "");
}
function setAnswer(k, t){
  if(t === FIELDS[k].f.body) delete answers[k]; else answers[k] = t;
  Store.save("answers", k); updateField(k, true); updateHeader(); renderRail();
}

/* ---------- events on the grant form ---------- */
$("main").addEventListener("input", e => {
  const ta = e.target.closest("textarea[data-id]:not([data-fact])");
  if(ta){
    const k = ta.dataset.id; answers[k] = ta.value; grow(ta);
    const {f} = FIELDS[k], s = stateOf(k);
    $("meta-"+k).innerHTML = metaHTML(f, s);
    const bl = $("bl-"+k), n = blanks(s.t).length;
    if(bl.querySelectorAll(".blank").length !== n) bl.innerHTML = blanksHTML(k, s.t);
    $("fld-"+k).classList.toggle("is-ready", s.ready);
    Store.save("answers", k); updateHeader(); clearTimeout(renderRail.t); renderRail.t = setTimeout(renderRail, 600);
    return;
  }
  const fa = e.target.closest("textarea[data-fact]");
  if(fa){ const k = fa.dataset.fact; facts[k] = fa.value; grow(fa); fa.closest(".fact").classList.toggle("filled", !!fa.value.trim()); Store.save("facts", k); clearTimeout(renderRail.t); renderRail.t = setTimeout(renderRail, 600); }
});
$("main").addEventListener("change", e => {
  const sel = e.target.closest("select[data-factpick]"); if(!sel || !sel.value) return;
  const row = sel.closest(".blank"); row.querySelector("input").value = facts[sel.value] || ""; sel.value = "";
  row.querySelector("input").focus();
});
$("main").addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.matches(".blank input")){ e.preventDefault(); doFill(e.target.closest(".blank")); }
});
$("main").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act, k = b.dataset.k;
  if(act === "fill") doFill(b.closest(".blank"));
  else if(act === "copy") copyText(textOf(k), "Answer copied");
  else if(act === "reset"){
    if(!b.dataset.confirm){ b.dataset.confirm = "1"; b.textContent = "Click again to reset"; return; }
    delete answers[k]; Store.save("answers", k); updateField(k, true); updateHeader(); renderRail(); toast("Reset to the original draft");
  }
  else if(act === "copyall") copyText(grantText(G.find(g => g.id === view)), "Whole application copied");
  else if(act === "download") download(G.find(g => g.id === view));
  else if(act === "nextblank"){
    const first = [...$("main").querySelectorAll(".blank input")][0];
    if(first){ first.scrollIntoView({block:"center"}); first.focus(); } else toast("No blanks left in this application");
  }
});
function doFill(row){
  const k = row.dataset.k, i = Number(row.dataset.i), v = row.querySelector("input").value.trim();
  if(!v){ row.querySelector("input").focus(); toast("Type the answer for this blank first"); return; }
  const t = textOf(k), b = blanks(t)[i]; if(!b) return;
  setAnswer(k, t.slice(0, b.i) + v + t.slice(b.i + b.s.length));
  const next = $("bl-"+k).querySelector(".blank input"); if(next) next.focus();
}

/* ---------- export ---------- */
function grantText(g){
  const out = [g.title, "Applicant: "+g.applicant, ""];
  g.groups.forEach(gr => {
    if(gr.title) out.push("== "+gr.title+" ==", "");
    gr.fields.forEach(f => out.push("### "+f.title+(f.limit ? " (limit "+f.limit+" "+f.unit+")" : ""), textOf(f.key), ""));
  });
  return out.join("\n");
}
async function copyText(t, msg){
  try{ await navigator.clipboard.writeText(t); toast(msg); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand("copy"); }catch(_){}
    ta.remove(); toast(ok ? msg : "Copy isn't allowed here. Select the text and copy it manually.");
  }
}
async function download(g){
  if(!DL) return;
  try{ await DL.save({filename:"KPD - "+g.short.replace(/[^\w\s.-]/g,"").trim()+".txt", data:grantText(g)}); toast("Saved"); }
  catch(e){ if(e && e.code !== "declined") toast("Couldn't save the file here. Use Copy instead."); }
}

/* ---------- facts view ---------- */
function renderFacts(){
  const filled = FACTS.filter(f => (facts[f.key]||"").trim()).length;
  let h = "<div class='ghead'><div class='eyebrow caps'>Fill once · reuse in every application</div><h1>Facts used everywhere</h1>"
    + "<p class='full'>These are the facts most applications ask for. Enter each one once. Then, next to any blank in an application, pick it from the <b>Use a fact…</b> dropdown to drop it in.</p>"
    + "<div class='prog'><span class='big num'>"+filled+"/"+FACTS.length+"</span><span class='muted'>facts filled in</span><span class='meter'><i style='width:"+(filled/FACTS.length*100)+"%'></i></span></div></div>";
  h += "<div class='fgrid'>" + FACTS.map(f => {
    const v = facts[f.key] || "";
    return "<div class='fact"+(v.trim()?" filled":"")+"'><label for='fact-"+f.key+"'>"+esc(f.label)+"</label>"+(f.hint?"<span class='hint'>"+esc(f.hint)+"</span>":"")+"<textarea id='fact-"+f.key+"' data-fact='"+f.key+"' data-id='"+f.key+"' rows='2'>"+esc(v)+"</textarea></div>";
  }).join("") + "</div>";
  $("main").innerHTML = h;
  $("main").querySelectorAll("textarea[data-fact]").forEach(grow);
}

init();
</script>
